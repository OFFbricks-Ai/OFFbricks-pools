idas<\/strong> na atualização, ou use <strong>$ Recolher Fees<\/strong>. O ROI não muda: só passa de pendentes para recolhidas.<\/li>\n<li><strong>Capital entra ou sai? ⇅ Reforço / Retirada<\/strong>. Para retirar tudo, <strong>✕ Fechar Pool<\/strong>.<\/li>\n<li><strong>Mudou o range? ↔ Mover range<\/strong> (só nas pools).<\/li>\n<li><strong>Alguém entrou ou saiu do vault?<\/strong> No mosaico <strong>Minha quota<\/strong>, <strong>Alterar<\/strong> a percentagem: pede confirmação e vale a partir dessa data.<\/li>\n<\/ol>\n<h2>Truques nos campos<\/h2>\n<ul>\n<li><strong>Somas:<\/strong> em qualquer campo de valor pode escrever <code>0.034+0.06<\/code> e a app mostra 0,094. Nas taxas, tocar na célula mostra as parcelas.<\/li>\n<li><strong>Taxas:<\/strong> somam-se desde o início e aparecem no mosaico <strong>Taxas<\/strong>.<\/li>\n<li><strong>Referência #<\/strong> (4 dígitos) só nas pools; nas auto-farms há um campo <strong>Notas<\/strong>.<\/li>\n<\/ul>\n<h2>Ler os números<\/h2>\n<ul>\n<li><strong>Capital investido<\/strong> = liquidez inicial + reforços − retiradas.<\/li>\n<li><strong>Variação<\/strong> = valor atual − capital investido. Não é a impermanent loss isolada.<\/li>\n<li><strong>ROI total<\/strong> = (variação + fees) ÷ capital médio.<\/li>\n<li><strong>APR (fees)<\/strong> = fees ÷ capital médio × 365 ÷ dias. Só aparece com 1 dia ou mais de histórico.<\/li>\n<li><strong>Capital médio<\/strong> = capital ponderado pelo tempo em que esteve aplicado.<\/li>\n<li>Nos vaults comunitários, tudo já leva a sua percentagem.<\/li>\n<\/ul>\n<h2>Preços, ranges e Krystal<\/h2>\n<p>O interruptor <strong>Offline<\/strong> no topo liga-se à internet uns segundos, atualiza os preços dos tokens, verifica se as pools estão dentro do range, procura uma versão nova da app e, se tiver carteiras registadas, vai buscar os seus vaults à Krystal.<\/p>\n<ul>\n<li><strong>Bolinha verde:<\/strong> dentro do range. <strong>Vermelha:<\/strong> fora. <strong>Cinzenta:<\/strong> não foi possível verificar.<\/li>\n<li>Se um token não for encontrado, use o <strong>✎<\/strong> da tabela de preços: endereço do contrato ou ID da CoinGecko.<\/li>\n<li><strong>⬇ Dados da Krystal<\/strong>, no cartão: mostra o que a plataforma diz (TVL, o seu valor, quota, APR) e só grava depois de confirmar.<\/li>\n<\/ul>\n<h2>⚙ Ajustes<\/h2>\n<ul>\n<li><strong>Ajuda:<\/strong> este guia, o manual completo e <strong>Instalar a app<\/strong>, que diz se a app está pronta a instalar e mostra o botão quando o Chrome o permite.<\/li>\n<li><strong>Ficheiros e segurança:<\/strong> exportar e importar backup.<\/li>\n<li><strong>Folhas de cálculo:<\/strong> exportar para Excel (.csv).<\/li>\n<li><strong>Contratos e carteiras:<\/strong> dê nomes aos contratos e às carteiras dos investidores (servem de índice). Pesquisa rápida com 2 ou 3 caracteres do nome ou do endereço.<\/li>\n<li><strong>Minhas Carteiras:<\/strong> as suas próprias carteiras, para saber a que carteira pertence cada posição e para ir buscar os vaults à Krystal.<\/li>\n<li><strong>Ficheiro de dados:<\/strong> gravação automática num ficheiro (só Chrome/Edge, no computador).<\/li>\n<\/ul>\n<h2>Não perder dados<\/h2>\n<ul>\n<li><strong>No computador (Chrome/Edge):<\/strong> Ajustes → Ficheiro de dados → <strong>Associar novo ficheiro de dados<\/strong> e guarde o .json numa pasta do OneDrive. Fica tudo gravado automaticamente.<\/li>\n<li><strong>Em qualquer lado: Exportar backup<\/strong>, com regularidade. O nome leva data e hora, e a app oferece-se para verificar o ficheiro.<\/li>\n<li><strong>Atenção:<\/strong> importar um backup <strong>substitui<\/strong> os dados atuais. Se o topo disser <strong>“Não está a gravar”<\/strong>, nada fica guardado: saia da navegação privada.<\/li>\n<\/ul>\n<h2>Corrigir<\/h2>\n<p>Na lista de lançamentos de cada pool, o <strong>✎<\/strong> edita qualquer campo e o <strong>✕<\/strong> elimina (com confirmação). Por omissão vê os três mais recentes; “Mostrar todos” abre o resto. Eliminar uma pool ou apagar tudo obriga a escrever “eliminar” ou “apagar”.<\/p>\n<h2>No telemóvel<\/h2>\n<p>Publique a pasta do pacote PWA num endereço HTTPS, abra-o no Safari (iPhone/iPad) ou no Chrome (Android) e adicione ao ecrã principal. Depois funciona offline. Os dados ficam ligados a esse endereço, por isso não o mude.<\/p>\n", manual: "<h1>Pool Monitor — Manual de utilização<\/h1>\n<p>Versão 9.6 · Instruções completas e descrição de cada função<\/p>\n<h2>1. O que é o Pool Monitor<\/h2>\n<p>O Pool Monitor é uma app de página única para acompanhar posições de liquidez (pools) em protocolos DeFi. Você regista o valor da posição e as fees ao longo do tempo, e a app calcula variação, ROI, APR e gráficos.<\/p>\n<ul>\n<li><strong>Funciona sempre offline.<\/strong> Não precisa de conta nem de servidor, e os dados ficam no seu dispositivo.<\/li>\n<li><strong>É manual.<\/strong> A app não lê blockchains: tudo o que mostra resulta do que lança. A única exceção é opcional: com a sua carteira da Krystal, pode ir buscar os seus vaults e confirmar antes de gravar (secção 9).<\/li>\n<li><strong>Todos os valores estão em USD.<\/strong><\/li>\n<li><strong>Única exceção à regra offline:<\/strong> o interruptor de preços e de verificação dos ranges (secção 9), que só se liga à internet durante a atualização.<\/li>\n<\/ul>\n<h2>2. Primeiros passos<\/h2>\n<ol>\n<li><strong>Abra a app.<\/strong> No computador, abra o ficheiro HTML num navegador (Chrome ou Edge dão mais funcionalidades). No telemóvel, veja a secção 10.<\/li>\n<li><strong>Escolha onde guardar os dados.<\/strong> Por defeito ficam no navegador. Para maior segurança, associe um ficheiro de dados (menu Ajustes, secção 7), por exemplo numa pasta do OneDrive.<\/li>\n<li><strong>Crie a primeira pool<\/strong> com o botão <strong>+ Nova Pool<\/strong> (secção 6.1).<\/li>\n<li><strong>Atualize com regularidade<\/strong> com <strong>✎ Atualizar<\/strong> (secção 6.2): valor atual da posição e fees acumuladas.<\/li>\n<li><strong>Consulte os resultados<\/strong> nos cartões, nos gráficos e nos rankings.<\/li>\n<\/ol>\n<p><strong>Dentro de Vaults, quando há mais de um vault, aparece uma linha com os vaults e, ao escolher um, outra com as suas posições; assim pode ver os números de um vault ou de uma posição em particular<\/strong>.<\/p>\n<h2>3. Conceitos essenciais<\/h2>\n<ul>\n<li>Separadores: no topo há dois, Pools de liquidez e Vaults. Dentro de Vaults há ainda dois botões, Auto-Farms e Vaults Comunitários, cada um com a sua contagem. Vê-se um de cada vez: a lista, os totais, os gráficos, os destaques, os alertas e os preços de tokens dizem respeito apenas ao que estiver escolhido, e nada se mistura. Ao abrir, a app vai para o separador que tem posições. Uma auto-farm é uma posição que um agente gere sozinho: ele é que acrescenta capital, muda o range, troca o par, recolhe fees e capitaliza. Por isso regista-se da mesma maneira (valor e fees), mas não tem range de preço nem a ação “Mover range”. O que lança é o que observa na plataforma: o valor atual (o TVL do vault), as fees e os movimentos de entrada e saída de capital. Numa auto-farm o Nome do vault é obrigatório e ocupa o lugar do campo Exchange; não se pedem tokens, porque o agente gere vários pares ao mesmo tempo. O Endereço é o do vault (o “CA”). No formulário de atualização, o campo do valor chama- se TVL Atual. Na atualização pode ainda registar, só para comparação, o APR e o PnL que a plataforma mostra: aparecem no mosaico “Dados da plataforma” do cartão e na linha do histórico, a par dos valores que a app calcula a partir do que lançou. <strong>Pool:<\/strong> uma posição de liquidez. Tem rede, exchange, dois tokens, um range de preço opcional e um histórico de lançamentos.<\/li>\n<li><strong>Lançamento:<\/strong> cada registo com data e hora (abertura, atualização, recolha, reforço, retirada, mover range, fecho). O estado atual da pool é o resultado de reproduzir os lançamentos por ordem cronológica.<\/li>\n<li><strong>Valor atual:<\/strong> valor da posição, sem as fees pendentes.<\/li>\n<li><strong>Fees pendentes (acumuladas):<\/strong> fees ainda não recolhidas, tal como o protocolo as mostra.<\/li>\n<li><strong>Fees recolhidas:<\/strong> fees já levantadas; só aumentam.<\/li>\n<li><strong>Capital investido<\/strong> = liquidez inicial + reforços − retiradas.<\/li>\n<li><strong>Variação<\/strong> = valor atual − capital investido.<\/li>\n<li><strong>Resultado registado<\/strong> = variação + fees recolhidas + fees pendentes.<\/li>\n<li><strong>Capital médio:<\/strong> capital investido ponderado pelo tempo em que esteve aplicado. Sem reforços nem retiradas, é igual à liquidez inicial.<\/li>\n<li><strong>ROI total<\/strong> = resultado registado ÷ capital médio.<\/li>\n<li><strong>APR (fees)<\/strong> = fees totais ÷ capital médio × 365 ÷ dias, sem capitalização. Só aparece com pelo menos 1 dia de histórico.<\/li>\n<li><strong>ROI anualizado<\/strong> = ROI × 365 ÷ dias (anualização simples).<\/li>\n<li><strong>Ativa / Fechada:<\/strong> uma pool fechada deixa de contar dias; ROI e APR ficam congelados na data do fecho.<\/li>\n<\/ul>\n<p>Os dias contam desde a abertura até ao <strong>último lançamento<\/strong>, não até hoje. Por isso, sem atualizações recentes, o APR fica “ancorado” no último lançamento.<\/p>\n<p><strong>Percentagem, REV e taxas.<\/strong> Nos vaults comunitários a sua parte é uma percentagem, que a app aplica a todos os valores (secção 6.16). O REV é o lucro pela gestão do vault, registado à parte (6.17). As taxas, ou gás, acumulam-se em cada pool (6.14). Os campos de valores aceitam somas, como 0.034+0.06 (6.15).<\/p>\n<h2>4. Ciclo de vida de uma pool<\/h2>\n<p>Os lançamentos e o efeito de cada um nos números:<\/p>\n<ul>\n<li><strong>Abertura:<\/strong> cria a pool com a liquidez inicial. Define o início da contagem de dias.<\/li>\n<li><strong>Atualização:<\/strong> define o novo valor atual e as fees pendentes. É o lançamento que alimenta o histórico de ROI e APR.<\/li>\n<li><strong>Recolha de fees:<\/strong> passa um valor de “pendentes” para “recolhidas”. O ROI não muda.<\/li>\n<li><strong>Reforço:<\/strong> soma ao valor atual e ao capital investido.<\/li>\n<li><strong>Retirada (parcial):<\/strong> subtrai do valor atual e do capital investido.<\/li>\n<li><strong>Mover range (rebalance):<\/strong> define o valor depois da operação, as fees recolhidas na operação (as pendentes ficam a zero) e o novo range. O capital investido não muda.<\/li>\n<li><strong>Fecho:<\/strong> define o valor final recebido e as fees recebidas. A pool passa a Fechada.<\/li>\n<\/ul>\n<p><strong>Exemplo.<\/strong> Abre uma pool a 1 de março com 5 000. A 11 de março atualiza: valor 5 100 e fees 40. Resultado: variação +100 (+2,00%), resultado registado +140 (ROI 2,80%), APR 29,2% (40 ÷ 5 000 × 365 ÷ 10 dias) e ROI anualizado 102,2%. A 21 de março faz um reforço de 1 000, sem nova atualização das fees: valor 6 100, investido 6 000, capital médio 5 000 (o reforço entrou no fim do período) e APR 14,6%, porque as mesmas 40 de fees passam a estar repartidas por 20 dias. Atualizar com regularidade mantém o APR fiel.<\/p>\n<h2>5. O ecrã principal, de cima para baixo<\/h2>\n<h3>5.1 Cabeçalho<\/h3>\n<ul>\n<li><strong>Logótipo e título:<\/strong> “Pool Monitor” com a versão, a linha “focado em” com o logótipo da Krystal e, por baixo, “Liquidez · ROI · APR · offline”. No fim da página, “powered by:” com o logótipo da OFFBRICKS.<\/li>\n<li><strong>Interruptor Offline/Online:<\/strong> atualiza os preços dos tokens e verifica os ranges (secção 9). Está sempre em “Offline”; liga-se só durante a atualização.<\/li>\n<li><strong>Indicador de estado:<\/strong> “Guardado no navegador”; “Guardado em (ficheiro) · hora” quando há ficheiro associado; “Erro ao gravar (ficheiro)” a vermelho; ou “Não está a gravar” a vermelho, quando o navegador não deixa guardar (ver secção 8).<\/li>\n<li><strong>Ajustes (roda dentada): ficheiros e segurança, folhas de cálculo, contratos e carteiras, ficheiro de dados<\/strong> e apagar tudo (secção 7).<\/li>\n<\/ul>\n<h3>5.2 Aviso (banner)<\/h3>\n<p>Aparece quando há algo a resolver: ficheiro associado a pedir autorização (botão “Voltar a ligar o ficheiro”); erro de gravação (botão “Tentar novamente”); sugestão para associar um ficheiro quando os dados estão só no navegador; ou, em navegadores sem gravação em<\/p>\n<p>ficheiro, o lembrete para exportar backups.<\/p>\n<h3>5.2b Separadores<\/h3>\n<p>Por baixo do aviso estão os separadores <strong>Pools de liquidez<\/strong> e <strong>Vaults<\/strong>, com a contagem de cada um. Ao escolher Vaults aparece uma segunda linha com <strong>Auto-Farms<\/strong> e <strong>Vaults Comunitários<\/strong>. Tudo o que vem a seguir — cartões de resumo, indicadores, resumos por rede e exchange, destaques, alertas, gráficos, lista e preços dos tokens — diz respeito apenas ao separador escolhido. Mudar de separador limpa também os filtros de rede e exchange.<\/p>\n<h3>5.3 Cartões de resumo<\/h3>\n<p>Seis cartões, que seguem o filtro ativo (Todas, Ativas, Fechadas, rede, exchange):<\/p>\n<ul>\n<li><strong>Investido:<\/strong> capital líquido aportado.<\/li>\n<li><strong>Valor atual:<\/strong> soma dos valores das pools, sem fees, no último lançamento de cada uma.<\/li>\n<li><strong>Variação:<\/strong> em USD e em % do capital médio. Não é a impermanent loss isolada.<\/li>\n<li><strong>Fees acum.:<\/strong> fees pendentes; por baixo, o total com as recolhidas.<\/li>\n<li><strong>ROI total:<\/strong> resultado registado em USD e em % do capital médio.<\/li>\n<li><strong>APR médio:<\/strong> média dos APRs ponderada pelo capital médio de cada pool; por baixo, o ROI anualizado. Pools sem APR calculável ficam fora da média.<\/li>\n<\/ul>\n<h3>5.4 Indicadores rápidos e filtros<\/h3>\n<ul>\n<li><strong>Indicadores:<\/strong> Pools, Ativas, Redes, Exchanges, Fees e Resultado. Alguns são atalhos: “Ativas” filtra; os restantes deslocam a página para a secção correspondente.<\/li>\n<li><strong>Barra de filtros:<\/strong> Todas, Ativas, Fechadas, mais a rede e a exchange escolhidas. O × junto a cada filtro remove-o.<\/li>\n<\/ul>\n<h3>5.5 Por rede, Por exchange e Ranking cruzado<\/h3>\n<ul>\n<li><strong>Por rede / Por exchange:<\/strong> barras proporcionais ao valor. Clicar numa barra filtra a página (✓ indica o filtro ativo); clicar de novo remove-o.<\/li>\n<li><strong>Ranking cruzado:<\/strong> três listas das pools, por APR, por resultado e por fees. Clicar no nome abre a pool.<\/li>\n<\/ul>\n<h3>5.6 Pares<\/h3>\n<p>Um botão por par de tokens, com o valor e o resultado. Clicar abre a pool.<\/p>\n<h3>5.7 Matrizes por rede e por exchange<\/h3>\n<p>Tabelas com Rede (ou Exchange), N (pools no filtro / ativas), Valor, % do total, Fees, Resultado e APR, com uma linha de total. Clicar no nome filtra.<\/p>\n<h3>5.8 Destaques<\/h3>\n<p>Seis cartões; clicar num cartão com pool abre-a:<\/p>\n<ul>\n<li><strong>Melhor APR (dados OK):<\/strong> só entram pools ativas com pelo menos 7 dias, 2 atualizações e atualizadas há menos de 7 dias.<\/li>\n<li><strong>Maior resultado<\/strong>, <strong>Mais fees<\/strong> e <strong>Menor resultado<\/strong> (ou, se for a mesma pool, o número de ativas).<\/li>\n<li><strong>Fees / valor:<\/strong> fees totais das pools ativas sobre o valor em posição.<\/li>\n<li><strong>Valor ativo:<\/strong> soma dos valores das pools abertas.<\/li>\n<\/ul>\n<h3>5.9 Alertas<\/h3>\n<ul>\n<li><strong>Sem atualização:<\/strong> pools ativas sem nenhuma atualização (APR incompleto).<\/li>\n<li><strong>Desatualizadas:<\/strong> última atualização há 7 dias ou mais (mostra as três mais antigas).<\/li>\n<li><strong>Amostra curta:<\/strong> APR calculado com menos de 7 dias ou menos de 2 atualizações.<\/li>\n<li><strong>Resultado negativo:<\/strong> pools ativas com resultado abaixo de −0,01 USD.<\/li>\n<li><strong>Concentração:<\/strong> uma rede com 60% ou mais do valor ativo (havendo mais de uma pool ativa).<\/li>\n<li><strong>Ranges:<\/strong> depois de ligar o interruptor, mostra “N pool(s) fora do range” (vermelho) ou “Dentro do range” (verde), e “Ranges por verificar” para as pools que não puderam ser verificadas.<\/li>\n<li>Se nada se aplicar: “Sem alertas básicos”. O monitor não verifica depeg nem a segurança dos protocolos.<\/li>\n<\/ul>\n<h3>5.10 Evolução da carteira<\/h3>\n<p>Gráfico da carteira inteira ao longo do tempo, com quatro separadores: <strong>Património<\/strong>, <strong>ROI<\/strong>, <strong>APR<\/strong> e <strong>Fees<\/strong>. Segue os filtros ativos. As cores dos gráficos de ROI, APR e Fees usam uma paleta pensada para daltónicos (laranja, azul-céu, amarelo e roxo claro), e a série secundária vai a tracejado.<\/p>\n<h3>5.11 A lista (Suas Pools / Auto-Farms / Vaults Comunitários)<\/h3>\n<p>A lista do separador escolhido, cujo título muda conforme ele (Pools de liquidez, Auto- Farms ou Vaults Comunitários), com os chips Todas / Ativas / Fechadas e o ordenador <strong>Recentes, Valor, ROI, APR, Fees<\/strong>. Em “Recentes”, as ativas vêm primeiro e depois a mais<\/p>\n<p>recente.<\/p>\n<h3>5.12 O cartão da pool<\/h3>\n<p><strong>Cabeçalho (sempre visível):<\/strong><\/p>\n<ul>\n<li>a bolinha do range (secção 9), iniciais, nome, selos (Ativa ou Fechada; “sem atualizações”; “atualizada há N d” quando passam 7 dias) e um minigráfico do valor;<\/li>\n<li>rede e exchange, clicáveis para filtrar;<\/li>\n<li>cinco métricas: <strong>Valor<\/strong> (e investido), <strong>Variação<\/strong> (% e USD), <strong>ROI<\/strong> (USD e %), <strong>APR<\/strong> (e dias de histórico) e <strong>Fees<\/strong> (pendentes e recolhidas).<\/li>\n<\/ul>\n<p>Clicar no cabeçalho expande a pool.<\/p>\n<p><strong>Detalhe (expandido):<\/strong><\/p>\n<ul>\n<li><strong>Mosaicos:<\/strong> Valor Inicial (com reforços e retiradas), Dias Ativos (com datas de abertura e fecho), Total Fees Recolhidas (com as pendentes), Range de Preço (com a bolinha e o resultado da última verificação), ROI Anualizado e Último Lançamento (com o capital médio usado como base). Nos vaults comunitários aparecem ainda Minha quota e REV; nas auto-farms, Dados da plataforma. No fim fica o mosaico Taxas, que só aparece quando há taxas lançadas.<\/li>\n<li><strong>Observações:<\/strong> a nota que escreveu ao criar a pool. Se a pool tiver endereço de contrato, aparece por baixo, abreviado (“Contrato da pool: 0x1234…abcd”).<\/li>\n<li><strong>Botões de ação<\/strong> (secção 6).<\/li>\n<li><strong>Histórico:<\/strong> gráfico com os separadores Liquidez, APR, ROI e Fees.<\/li>\n<li><strong>Lançamentos:<\/strong> tabela com Data, Tipo, # (a sua referência de 4 dígitos, só nas pools), detalhe do lançamento (sem a palavra “valor”), Taxas, detalhe do lançamento, valor atual, fees pendentes, fees recolhidas, variação, ROI e APR depois de cada lançamento, e os botões de editar (✎) e eliminar (✕) de cada linha (secções 6.10 e 6.13).<\/li>\n<\/ul>\n<h3>5.13 Preços dos tokens, indicadores e boas práticas<\/h3>\n<p>A tabela de preços (secção 9) e duas secções recolhíveis no fim: <strong>Como os indicadores são calculados<\/strong> (as fórmulas da secção 3) e <strong>Boas práticas<\/strong>.<\/p>\n<h2>6. Ações sobre as pools<\/h2>\n<p>Todos os formulários pedem <strong>Data<\/strong> e <strong>Hora<\/strong> (por defeito, agora). Regras comuns: a data não pode ser anterior à abertura da pool nem estar no futuro, e os valores não podem ser negativos. Os campos numéricos mostram uma prévia do valor interpretado (“= $1,50”). Aceitam vírgula ou ponto decimal; nos campos de dinheiro, “1.500” significa mil e<\/p>\n<p>quinhentos. Também aceitam somas: escreva 0.034+0.06 e a app mostra 0,094 (ver 6.15). Pode lançar datas passadas: o histórico reordena-se sozinho. As ações destrutivas (eliminar, reabrir, apagar tudo e importar backup) pedem confirmação num quadro da própria app, que se cancela com “Cancelar”, com a tecla Esc ou clicando fora dele.<\/p>\n<h3>6.1 + Novo (criar)<\/h3>\n<p>O botão azul chama-se + Novo. Ao clicar, a app pergunta em dois passos. No primeiro: Novo Vault ou Nova Pool. Se escolher Novo Vault, o segundo passo pergunta Auto-Farm Vault ou Vault Comunitário (com um botão Voltar). “Nova Pool” e “Vault Comunitário” abrem o formulário das pools, mas o de Vault Comunitário pede ainda, a seguir ao endereço da pool, o Endereço do vault-mãe (contrato). É esse endereço que agrupa as pools do mesmo vault: se o deixar em branco, a pool é guardada como pool de liquidez simples e fica fora da família dos vaults. No separador Vaults Comunitários as pools aparecem debaixo de um cabeçalho por vault-mãe, com o número de pools e o valor somado; “Auto-Farm Vault” abre o das auto-farms, descrito abaixo. Campos obrigatórios: <strong>Token 1<\/strong>, <strong>Token 2<\/strong>, <strong>Liquidez Inicial (USD)<\/strong> (maior que zero), <strong>Data de Criação<\/strong> e <strong>Hora<\/strong>. Opcionais: <strong>Rede<\/strong>, <strong>Exchange<\/strong>, <strong>Nome da Pool<\/strong> (em branco usa “Token1/Token2”), <strong>Range Mínimo e Máximo<\/strong> (o mínimo tem de ser menor que o máximo), o Endereço da pool (contrato) (secção 6.12) e <strong>Observações<\/strong>. Opcional em todos: Taxas (USD), com o gás da criação. No Vault Comunitário há ainda a Minha percentagem (%), obrigatória, ao lado da liquidez inicial (ver 6.16). Cria o lançamento de abertura.<\/p>\n<h3>6.2 ✎ Atualizar<\/h3>\n<p>Campos: <strong>Valor Atual<\/strong> (valor da posição agora, sem as fees pendentes) e <strong>Fees Acumuladas<\/strong> (fees ainda não recolhidas, como o protocolo mostra). Vêm preenchidos com os últimos valores. Ao lado das fees há a opção **Já recolhidas**: se a deixar em branco, as fees ficam como pendentes; se a marcar, entram como recolhidas e as pendentes ficam a zero, poupando-lhe o passo de ir depois a “Recolher Fees”. Nesse caso a app regista dois lançamentos com a mesma data, a atualização e a recolha, e o ROI é igual nas duas formas. Todos os formulários têm o campo opcional Taxas (USD), e nos vaults comunitários há ainda o REV (ver 6.17). É o lançamento mais importante: cada atualização acrescenta um ponto ao histórico.<\/p>\n<h3>6.3 $ Recolher Fees<\/h3>\n<p>O botão só aparece quando há fees pendentes. Campo: <strong>Valor recolhido<\/strong> (maior que zero; por defeito, as pendentes). Esse valor sai de “Fees Acumuladas” e passa a “Fees Recolhidas”. O ROI não muda, porque o resultado soma pendentes e recolhidas.<\/p>\n<h3>6.4 ↔ Mover range<\/h3>\n<p>Campos: <strong>Valor da posição após o rebalance<\/strong> (já no novo range, sem fees pendentes), <strong>Fees recolhidas no rebalance<\/strong>, <strong>Novo range mínimo<\/strong> e <strong>máximo<\/strong>. Os quatro são obrigatórios e começam vazios, para não gravar por engano valores antigos; o range anterior aparece apenas como sugestão dentro do campo. As fees passam a “recolhidas”, as pendentes ficam a zero e o range da pool passa a ser o novo. O capital investido não muda. Gas, slippage e bridge não são descontados automaticamente.<\/p>\n<h3>6.5 ⇅ Reforço / Retirada<\/h3>\n<p>Campos: <strong>Movimento<\/strong> (Reforço, para adicionar liquidez, ou Retirada parcial), <strong>Valor<\/strong> em USD no momento da operação. O valor atual e o capital investido ajustam-se; ROI e APR passam a usar o capital médio. Uma retirada tem de ser menor que o valor atual: para retirar tudo, use Fechar Pool.<\/p>\n<h3>6.6 ✕ Fechar Pool<\/h3>\n<p>Campos: <strong>Valor final recebido<\/strong> (sem fees) e <strong>Fees recebidas no fecho<\/strong>. Os dois campos começam vazios e são obrigatórios. O fecho não pode ser anterior ao último lançamento. A pool passa a Fechada e os indicadores ficam congelados nessa data.<\/p>\n<h3>6.7 ↺ Reabrir<\/h3>\n<p>Só existe em pools fechadas. Remove o lançamento de fecho (pede confirmação) e a pool volta a Ativa, com o estado anterior ao fecho.<\/p>\n<h3>6.8 Editar dados<\/h3>\n<p>Altera rede, exchange, tokens, nome, range, endereço da pool, observações, liquidez inicial, taxas da criação e data de criação e, nos vaults comunitários, a percentagem inicial e o vault-mãe. Alterar a liquidez inicial reescreve o valor da abertura (não cria um reforço). Não é possível mover a data de criação para depois de lançamentos já existentes.<\/p>\n<h3>6.9 🗑 Eliminar (pool)<\/h3>\n<p>Apaga a pool e todo o histórico. Como medida de segurança, o quadro de confirmação só ativa o botão Eliminar depois de escrever a palavra “eliminar” (também vale em maiúsculas). Não é reversível, a não ser com um backup.<\/p>\n<h3>6.10 Eliminar um lançamento<\/h3>\n<p>Na tabela de lançamentos, o botão de cada linha apaga esse lançamento (com confirmação); a abertura não pode ser eliminada (pode editá-la com o ícone ✎ ou em Editar dados). Para corrigir um lançamento, normalmente basta editá-lo (secção 6.13); elimine-o só se ele não devia existir. Se eliminar um rebalance, o range volta ao do rebalance anterior ou, não havendo, ao original.<\/p>\n<h3>6.11 Referência # (só nas pools)<\/h3>\n<p>Nas pools e nos vaults comunitários, os formulários de lançamento começam com o campo opcional <strong>Referência #<\/strong>, para guardar até 4 dígitos do hash da transação (por exemplo, os últimos 4 que sejam números), só para sua referência. O campo aceita apenas dígitos, pelo que no iPad e no iPhone abre logo o teclado numérico, e é uma caixa curta, do tamanho dos 4 dígitos. Letras e símbolos são ignorados ao escrever ou colar, e os zeros à esquerda são respeitados (“0042”). Aparece na coluna “#” da tabela de lançamentos (entre Tipo e Lançamento) e no CSV. Pode ser alterada depois, editando o lançamento (secção 6.13). Nas auto-farms este campo não existe: em vez dele, cada formulário termina com um campo Notas, de texto livre, que aparece no detalhe da linha do histórico; a tabela das auto-farms também não tem a coluna “#”.<\/p>\n<h3>6.12 Endereço da pool (contrato)<\/h3>\n<p>O <strong>Endereço da pool (contrato)<\/strong> é um campo opcional de Nova Pool e de Editar dados. É o endereço do contrato da própria pool (nas redes EVM começa por 0x; na Solana é o endereço da pool) e <strong>não<\/strong> é o hash de uma transação nem a referência de 4 caracteres da secção 6.11. Serve para verificar o range com o preço da própria pool, em vez do preço de mercado dos tokens. Sem endereço, a verificação continua a funcionar com o preço de mercado.<\/p>\n<ul>\n<li><strong>Formatos aceites:<\/strong> endereços EVM (0x e 40 caracteres), objetos Sui (0x e 64 caracteres) e endereços Solana. Um endereço inválido é recusado no formulário.<\/li>\n<li><strong>Onde o encontrar:<\/strong> no protocolo (página da pool ou da posição) ou no explorador de blocos da rede.<\/li>\n<li><strong>Que rede usa:<\/strong> a que estiver no campo Rede (Arbitrum, Base, Solana, etc.). Se a rede não for reconhecida, ou o endereço não for encontrado nela, a app procura o endereço em todas as redes.<\/li>\n<li><strong>Onde aparece:<\/strong> no detalhe da pool (abreviado), no CSV do resumo das pools e nos backups.<\/li>\n<\/ul>\n<h3>6.13 Editar um lançamento<\/h3>\n<p>Cada linha da tabela de lançamentos de uma pool (em “Suas Pools”, com a pool aberta) tem o ícone <strong>✎<\/strong>. Serve para corrigir qualquer campo do lançamento, incluindo a abertura e o fecho.<\/p>\n<p><strong>Como usar:<\/strong><\/p>\n<ol>\n<li>Abra a pool e a lista “Lançamentos”.<\/li>\n<li>Clique no ✎ da linha. Abre-se um formulário com os valores atuais.<\/li>\n<li>Altere o que precisar e clique em <strong>Guardar alterações<\/strong>.<\/li>\n<\/ol>\n<p><strong>Campos editáveis, por tipo de lançamento:<\/strong><\/p>\n<ul>\n<li><strong>Abertura:<\/strong> liquidez inicial, data e hora.<\/li>\n<li><strong>Atualização:<\/strong> valor atual, fees acumuladas, data, hora e referência #.<\/li>\n<li><strong>Recolha de fees:<\/strong> valor recolhido, data, hora e hash.<\/li>\n<li><strong>Reforço / Retirada:<\/strong> o movimento (pode trocar de reforço para retirada e vice-versa), o valor, a data, a hora e o hash.<\/li>\n<li><strong>Mover range:<\/strong> valor após o rebalance, fees recolhidas, novo range mínimo e máximo, data, hora e hash.<\/li>\n<li><strong>Fecho:<\/strong> valor final, fees recebidas, data, hora e hash.<\/li>\n<\/ul>\n<p><strong>O que a app valida ao guardar:<\/strong><\/p>\n<ul>\n<li>Data e hora válidas e não no futuro; valores não negativos e, nas recolhas, reforços e retiradas, maiores que zero.<\/li>\n<li>Fees preenchidas nas atualizações, rebalances e fechos; range mínimo menor que o máximo; hash com no máximo 4 caracteres.<\/li>\n<li>Coerência com todo o histórico: nenhum lançamento antes da abertura, nenhum depois do fecho, e nenhuma retirada igual ou maior que o valor da pool nesse momento. Só são recusados os problemas criados pela sua edição; inconsistências antigas não bloqueiam alterações sem relação com elas.<\/li>\n<li>Se algo estiver errado, o formulário mostra a mensagem e não grava nada.<\/li>\n<\/ul>\n<p><strong>O que acontece ao guardar:<\/strong><\/p>\n<ul>\n<li>Só os campos que alterou são atualizados; os restantes ficam intactos. Se não alterou nada, o formulário fecha sem gravar.<\/li>\n<li>ROI, APR, capital médio, gráficos, alertas e rankings recalculam-se sozinhos a partir dos lançamentos.<\/li>\n<li>Ao editar um rebalance, o range atual da pool passa a ser o do último rebalance.<\/li>\n<li>Se mudar a data, o lançamento muda de lugar no histórico sozinho. A edição sincroniza com o ficheiro associado: com vários computadores, cada lançamento fica com a edição mais recente.<\/li>\n<li>Os lançamentos ficam todos no histórico da pool.<\/li>\n<\/ul>\n<h3>6.14 Taxas (USD)<\/h3>\n<p>Todos os formulários de lançamento, e também a criação da pool, têm o campo opcional <strong>Taxas (USD)<\/strong>, para o gás e outras taxas da operação. Pode deixá-lo em branco. As taxas somam-se desde a abertura e o total aparece no mosaico <strong>Taxas<\/strong>, no fim dos mosaicos do cartão (só aparece quando há taxas lançadas). A tabela de lançamentos tem uma coluna <strong>Taxas<\/strong>. Ainda não entram no ROI.<\/p>\n<h3>6.15 Somas nos campos<\/h3>\n<p>Em qualquer campo numérico pode escrever uma soma: 0.034+0.06 vale 0,094, e o campo mostra o resultado enquanto escreve. Funciona com quantas parcelas quiser e aceita vírgula ou ponto. As parcelas ficam guardadas: na tabela de lançamentos, a célula das taxas que veio de uma soma tem um sublinhado ponteado; passe o rato por cima, ou toque nela no telemóvel, para ver as parcelas e o total. Uma parcela mal escrita faz o lançamento ser recusado.<\/p>\n<h3>6.16 Minha percentagem (vaults comunitários)<\/h3>\n<p>Nos vaults comunitários há outros investidores, por isso a sua parte da pool é uma percentagem.<\/p>\n<ul>\n<li><strong>Ao criar:<\/strong> o campo obrigatório <strong>Minha percentagem (%)<\/strong> fica ao lado da liquidez inicial, com a opção <strong>“Os valores que lanço são o total da pool”<\/strong>. Marcada (predefinição): lança os números da plataforma e a app aplica a sua percentagem a tudo, ou seja, liquidez, fees, reforços, retiradas e fecho. Desmarcada: lança já só a sua parte, e a percentagem fica como informação.<\/li>\n<li><strong>No cartão:<\/strong> o mosaico <strong>Minha quota<\/strong> mostra a percentagem atual, com o botão <strong>Alterar<\/strong>. A alteração abre um quadro próprio, com data e hora, e pede confirmação a dizer de quanto para quanto muda e a partir de quando. Não está nos formulários do dia a dia, para não ser alterada por engano.<\/li>\n<li><strong>No histórico:<\/strong> cada alteração fica como lançamento “Minha percentagem”. Os lançamentos anteriores à data mantêm a percentagem antiga e os seguintes usam a nova. Pode editar ou eliminar esse lançamento, e tudo se recalcula.<\/li>\n<\/ul>\n<h3>6.17 REV (vaults comunitários)<\/h3>\n<p>O campo <strong>REV (USD)<\/strong>, na atualização dos vaults comunitários, regista o lucro pela gestão do vault, acumulado. Abre com o último valor lançado, não é multiplicado pela sua percentagem e não entra no ROI nem no APR. Aparece no mosaico <strong>REV<\/strong> do cartão e no detalhe do lançamento, e pode ser corrigido ao editar o lançamento.<\/p>\n<h2>7. O menu Ajustes<\/h2>\n<p>O botão <strong>⚙ Ajustes<\/strong>, no topo, junta tudo o que não é lançar dados. Está organizado em grupos, por esta ordem, e o menu fecha-se sozinho ao escolher um item.<\/p>\n<p><strong>Ajuda<\/strong><\/p>\n<ul>\n<li><strong>Guia rápido…<\/strong> e <strong>Manual completo…:<\/strong> abrem estas instruções dentro da própria app, sem precisar de internet. Instalar a app… verifica se a app está pronta a instalar (endereço https, manifesto, ícones e modo offline), explica o que falta corrigir e, quando o Chrome o permite, mostra o botão Instalar app; no iPhone e no iPad indica o caminho no Safari (Partilhar → Adicionar ao ecrã principal). Depois de instalada, abra-a sempre pelo ícone: num separador do navegador continua a parecer uma página.<\/li>\n<\/ul>\n<p><strong>Ficheiros e segurança<\/strong><\/p>\n<ul>\n<li><strong>Exportar backup (.json):<\/strong> descarrega uma cópia completa, com a data e a hora no nome, por exemplo pool-monitor-backup-2026-11-01_17h00m44.json. A seguir, a app mostra o nome gravado e quantas pools e lançamentos foram exportados, e oferece- se para verificar o ficheiro: escolha o que acabou de guardar e ela relê-o, confirmando que está legível e completo. Avisa se estiver truncado, se não for um backup do Pool Monitor, ou se tiver menos dados do que os atuais.<\/li>\n<li><strong>Importar backup (.json)…:<\/strong> carrega um backup e <strong>substitui<\/strong> os dados atuais.<\/li>\n<\/ul>\n<p><strong>Folhas de cálculo<\/strong><\/p>\n<ul>\n<li><strong>Exportar lançamentos para Excel (.csv):<\/strong> uma linha por lançamento, com a carteira, o tipo de posição, os valores informados e as métricas calculadas depois de cada um.<\/li>\n<li><strong>Exportar resumo das pools para Excel (.csv):<\/strong> uma linha por pool, com tokens, estado, datas, range, capital, valor, variação, fees, ROI, APR, capital médio, dias, observações, endereço da pool, vault-mãe e carteira.<\/li>\n<\/ul>\n<p><strong>Contratos e carteiras<\/strong><\/p>\n<ul>\n<li><strong>Contratos e carteiras…:<\/strong> dê um nome aos contratos e às carteiras dos investidores (estas servem só de índice, para as reconhecer). Onde a app mostrava o endereço passa a mostrar o nome (no detalhe da pool, no vault-mãe, nos cabeçalhos e nos botões dos vaults), e nos campos de endereço pode escrever o nome em vez do contrato. A lista mostra o contrato abreviado, o nome e onde é usado, tem <strong>+ Novo nome<\/strong>, ✎ para mudar e ✕ para remover, e assinala os contratos em uso sem nome. No topo há uma pesquisa rápida: bastam 2 ou 3 caracteres do nome ou do endereço, e aceita o endereço como a app o mostra (0x13e2…58d2). Os botões Todos, Contratos e Carteiras filtram por tipo; ao criar, a app pergunta se é um contrato ou uma carteira de investidor, e um toque na coluna Tipo troca entre os dois. Os nomes não se repetem. Sem nome, a app mostra o contrato abreviado (0x1111…1111).<\/li>\n<li><strong>Minhas Carteiras…: registe as suas própri<\/strong>as carteiras com um nome. Cada pool, vault ou auto-farm pode ser associado a uma carteira, ao criar ou ao editar (campo <strong>Minha carteira<\/strong>), para saber sempre a que carteira se referem os movimentos. A carteira aparece no cartão e no detalhe da pool, e nos dois ficheiros CSV. Remover uma carteira deixa as suas pools sem carteira, e a app avisa quantas. Com carteiras registadas, a app também vai buscar à Krystal os vaults e a quota de cada uma quando liga o interruptor no topo (secção 9).<\/li>\n<\/ul>\n<p><strong>Ficheiro de dados (gravação automática)<\/strong><\/p>\n<ul>\n<li><strong>Associar novo ficheiro de dados…:<\/strong> escolha onde guardar um ficheiro .json; a partir daí a app grava nele sempre que alterar alguma coisa (secção 8).<\/li>\n<li><strong>Abrir ficheiro de dados existente…:<\/strong> liga a app a um ficheiro que já tenha, juntando os dados dos dois lados sem apagar nada.<\/li>\n<li><strong>Desassociar:<\/strong> aparece quando há ficheiro ligado; deixa de gravar no ficheiro, e os dados continuam no navegador.<\/li>\n<li>No Safari, no Firefox e nas apps instaladas no telemóvel, os dois primeiros aparecem com a indicação “Indisponível neste navegador” e explicam porquê. Nesses casos, use o backup.<\/li>\n<\/ul>\n<p><strong>Apagar todos os dados…:<\/strong> apaga tudo, depois de escrever a palavra “apagar” no quadro de confirmação. Exporte um backup antes.<\/p>\n<h2>8. Dados, ficheiro e sincronização<\/h2>\n<ul>\n<li><strong>Onde ficam os dados:<\/strong> no armazenamento do navegador e, se associar um ficheiro, também nesse ficheiro. Limpar os dados do navegador apaga a cópia local: por isso convém associar um ficheiro ou exportar backups.<\/li>\n<li><strong>Quando a app não consegue gravar:<\/strong> em navegação privada, ou com restrições de privacidade, o navegador pode recusar a gravação, e o armazenamento também pode estar cheio. Nesse caso o indicador passa a “Não está a gravar” e aparece um aviso vermelho no topo, com o motivo e um botão para exportar backup. A app continua a funcionar, mas tudo o que registar desaparece ao fechar a janela. Para resolver, abra a app numa janela normal (não privada) ou liberte espaço. <strong>Gravação automática:<\/strong> com ficheiro associado, cada alteração é gravada nele. Ao reabrir a app, o navegador pode pedir autorização para voltar a aceder ao ficheiro (botão “Voltar a ligar o ficheiro”).<\/li>\n<li><strong>Vários computadores (por exemplo, OneDrive):<\/strong> a app combina os dados em vez de sobrescrever. Ao abrir, ao gravar e ao voltar à janela, lê o ficheiro e junta pools e lançamentos de ambos os lados. Exclusões propagam-se, os dados cadastrais e cada lançamento editado vêm da edição mais recente, e cada preço de token fica com a atualização mais recente. A sincronização espera enquanto um formulário estiver aberto.<\/li>\n<li><strong>Exceções:<\/strong> “Importar backup” e “Apagar todos os dados” substituem o ficheiro por inteiro. Se o mesmo dado cadastral for editado nos dois computadores antes de sincronizar, vale a edição mais recente (depende dos relógios). Cópias “em conflito” criadas pelo OneDrive são ficheiros separados e não são combinadas.<\/li>\n<li><strong>Boa prática:<\/strong> exporte um backup de vez em quando e antes de operações destrutivas.<\/li>\n<\/ul>\n<h2>9. Preços dos tokens e verificação do range<\/h2>\n<p>A app trabalha sempre offline. O interruptor <strong>Offline<\/strong> no topo é a única forma de ela ir à internet, e só durante a atualização.<\/p>\n<p><strong>Como usar:<\/strong><\/p>\n<ol>\n<li>Clique no interruptor. Passa a “Online…”.<\/li>\n<li>A app pede os preços à CoinGecko e volta sozinha a “Offline”.<\/li>\n<li>Veja a tabela <strong>Preços dos tokens<\/strong>, no fim da lista de pools.<\/li>\n<\/ol>\n<p><strong>Quais tokens:<\/strong> o Token 1 e o Token 2 das pools abertas com valor maior que zero (mesmo residual). As pools fechadas ficam de fora.<\/p>\n<p><strong>Colunas:<\/strong> Token, Moeda (nome e fonte), Preço (USD), Var. (face à atualização anterior), Atualizado (data e hora) e Pools (quantas usam o token).<\/p>\n<p><strong>Símbolo errado ou não encontrado:<\/strong> a CoinGecko procura por símbolo e devolve a moeda com maior capitalização, o que pode falhar em tokens pequenos. A coluna “Moeda” mostra o nome encontrado para conferir. Se estiver errado, o<strong>u se o símbolo não for encontrado, o botão ✎ da linha permite identificar o token de duas maneiras: pelo endereço do contrato do token (por exemplo 0x55d398326f99059ff775485246999027b3197955), que é o mais fiável e funciona em qualquer rede — o preço passa a vir da DexScreener, do par com mais liquidez, e a linha fica marcada “contrato”; ou pelo ID da CoinGecko (o último segmento do endereço da moeda em coingecko.com, por exemplo coinbase- wrapped-btc), e a linha fica marcada “ID fixo”. Deixar o campo em branco volta a procurar pelo símbolo<\/strong>.<\/p>\n<p><strong>Chave API (opcional):<\/strong> o link por baixo da tabela guarda, só neste dispositivo, uma chave gratuita da CoinGecko, útil se o limite de pedidos for atingido.<\/p>\n<p><strong>Mensagens:<\/strong> a app indica se a atualização correu bem, se faltaram tokens, se o limite de pedidos foi atingido, se a CoinGecko recusou o pedido ou se não foi possível contactá-la (sem ligação, limite de pedidos atingido ou pedido bloqueado pelo navegador). Da primeira vez que vê um token, a app procura o identificador dessa moeda na CoinGecko e guarda- o, para que as atualizações seguintes sejam um único pedido. Um símbolo que a CoinGecko não conheça fica assinalado na tabela como “símbolo não encontrado (use ✎)” e só volta a ser procurado 24 horas depois. Quando a CoinGecko falha, a app tenta a Binance (dados públicos de mercado, pares contra USDT) para os tokens em falta e diz quantos obteve por aí. Se a página onde a app está aberta bloquear os pedidos à internet (por exemplo, numa pré-visualização dentro de outra aplicação), a mensagem diz isso mesmo: abra a app diretamente no navegador ou instalada a partir do seu endereço. Se a app estiver instalada a partir de um endereço (PWA), o interruptor também verifica se há uma versão nova da própria app (secção 10).<\/p>\n<p><strong>Privacidade:<\/strong> ao atualizar, os símbolos dos tokens seguem para a CoinGecko e, nas pools com endereço de contrato, esse endereço segue para a DexScreener; se a CoinGecko falhar, os símbolos dos tokens em falta seguem para a Binance. Mais nada sai da app. Os preços não alteram os valores das pools, que continuam a ser os que lança manualmente.<\/p>\n<p><strong>Verificação do range (bolinhas):<\/strong> quando a atualização dos preços termina, a app verifica se cada pool aberta, com range definido, está dentro dele. Mostra uma bolinha no cartão da pool, ao lado do nome, e no mosaico “Range de Preço”:<\/p>\n<ul>\n<li><strong>Verde alface:<\/strong> dentro do range.<\/li>\n<li><strong>Vermelho Ferrari:<\/strong> fora do range.<\/li>\n<li><strong>Cinzenta:<\/strong> não foi possível verificar (a pool não tem range, ou faltou o preço de um token).<\/li>\n<\/ul>\n<p><strong>De onde vem o preço usado:<\/strong><\/p>\n<ul>\n<li><strong>Pool com endereço de contrato:<\/strong> o preço da própria pool, obtido na DexScreener (sem chave). Funciona com os tokens pela ordem inversa e trata WETH como ETH, WSOL como SOL e equivalentes.<\/li>\n<li><strong>Pool sem endereço:<\/strong> o preço de mercado do par (Token 1 em Token 2), calculado com os preços da CoinGecko. Aceita o range escrito no sentido inverso do par.<\/li>\n<li><strong>Se falhar:<\/strong> com o endereço não encontrado, ou a DexScreener indisponível, a app usa o preço de mercado e avisa disso no balão da bolinha.<\/li>\n<li><strong>Sempre preços novos:<\/strong> só conta o que foi obtido nessa atualização, nunca preços antigos. Pools fechadas não têm bolinha.<\/li>\n<\/ul>\n<p><strong>Onde ver o resultado:<\/strong> o balão da bolinha (passar o rato por cima) mostra o estado, a fonte e o preço usado, o range e a hora da verificação. No telemóvel, os mesmos dados aparecem no mosaico “Range de Preço”. Há ainda um resumo na mensagem da atualização (“Ranges: 3 dentro, 1 fora”) e nos Alertas.<\/p>\n<p><strong>Os meus vaults na Krystal (opcional):<\/strong><\/p>\n<ul>\n<li>Em Ajustes → Minhas <strong>Carteiras…<\/strong>, registe as carteiras que usa na Krystal.<\/li>\n<li>Ao ligar o interruptor <strong>Offline<\/strong>, a app procura os vaults de cada carteira, mesmo que não haja preços a atualizar, e diz quantos encontrou. Se falhar, veja a linha “Krystal vaults” em “Detalhes da última tentativa”.<\/li>\n<li>Nas pools cujo endereço bate certo (o vault-mãe nos vaults comunitários, o endereço do vault nas auto-farms) aparece o botão <strong>⬇ Dados da Krystal<\/strong>. Mostra o nome, a carteira, o TVL, o seu valor, a sua quota, o APR e o PnL, e só grava depois de confirmar: um lançamento com a data e a hora atuais e, se a quota mudou, uma alteração de percentagem. Se a pool ainda não tinha carteira, fica associada à que a Krystal indicou.<\/li>\n<li>A Krystal usa um endereço público, sem documentação oficial, por isso pode mudar ou vir incompleto. Nada é gravado sem a sua confirmação. Na pré-visualização do Claude, o pedido é bloqueado.<\/li>\n<\/ul>\n<h2>10. Usar no telemóvel (PWA)<\/h2>\n<ul>\n<li><strong>Instalar:<\/strong> publique a pasta do pacote PWA num endereço HTTPS (Netlify Drop ou GitHub Pages). No iPhone, abra no Safari e use Partilhar → Adicionar ao ecrã principal. No Android, abra no Chrome e use Instalar app.<\/li>\n<li><strong>Offline:<\/strong> depois de aberta uma vez com internet, funciona sem ligação.<\/li>\n<li><strong>Dados:<\/strong> ficam no telemóvel, ligados ao endereço onde publicou. Mudar de endereço obriga a exportar e importar um backup.<\/li>\n<li><strong>Sem ficheiro associado:<\/strong> a associação a ficheiros não existe nos navegadores de telemóvel. Para levar dados do computador, exporte o backup no PC, envie o ficheiro para o telemóvel e use Importar backup.<\/li>\n<li><strong>Backups:<\/strong> no telemóvel, Exportar backup abre a folha de partilha (Guardar em Ficheiros, Drive…). Faça-os com regularidade: o iPhone pode limpar os dados de uma app web.<\/li>\n<li><strong>Atualizar a app:<\/strong> quem publica a app só tem de substituir os ficheiros no sítio onde a alojou (por exemplo, arrastar a nova pasta para o Netlify); a versão vai preenchida no pacote. No telemóvel ou no tablet, ao ligar o interruptor Offline, a app verifica se há versão nova, descarrega-a e mostra o aviso “Nova versão … pronta” com o botão Atualizar agora. Os dados mantêm-se.<\/li>\n<\/ul>\n<h2>11. Perguntas frequentes<\/h2>\n<ul>\n<li><strong>O APR aparece como “—”.<\/strong> Faltam pelo menos 1 dia de histórico ou capital registado.<\/li>\n<li><strong>O APR está muito alto ou muito baixo.<\/strong> Janelas curtas exageram; sem atualizações recentes o APR desce. Atualize com regularidade e veja o ROI em USD.<\/li>\n<li><strong>O ROI não mudou depois de recolher fees.<\/strong> É normal: recolher só move valor de pendentes para recolhidas.<\/li>\n<li><strong>Não consigo retirar tudo.<\/strong> Use Fechar Pool.<\/li>\n<li><strong>Dá erro de data.<\/strong> A data tem de ser posterior à abertura e não pode estar no futuro; o fecho não pode ser anterior ao último lançamento.<\/li>\n<li><strong>Registei um valor errado.<\/strong> Edite o lançamento com o ícone ✎ da tabela (secção 6.13). Se ele não devia existir, elimine-o.<\/li>\n<li><strong>Os números não batem com o protocolo.<\/strong> A app não desconta gas, slippage, bridge, impostos nem custo de oportunidade, e só conhece o que lançou.<\/li>\n<li><strong>Perdi os dados.<\/strong> Se limpou o navegador, recupere de um backup ou do ficheiro associado. No Safari e no iPhone, o sistema pode apagar os dados de um site que não visite há algumas semanas, por isso exporte backups com regularidade. E se o indicador no topo disser “Não está a gravar”, nada do que registar fica guardado (ver secção 8).<\/li>\n<li><strong>A bolinha está vermelha, mas o protocolo diz que a posição está no range.<\/strong> Confirme que o range registado é o da posição atual (depois de um rebalance, registe o novo range) e que o Token 1 e o Token 2 correspondem ao par. Sem endereço de contrato, o preço vem do mercado e pode diferir um pouco perto dos limites; com endereço, vem da própria pool.<\/li>\n<li><strong>A bolinha está cinzenta.<\/strong> A pool não tem range, ou faltou o preço de um token. Ligue o interruptor, fixe o ID da CoinGecko (✎) do token em falta ou preencha o endereço da pool.<\/li>\n<\/ul>\n<h2>12. Limitações<\/h2>\n<ul>\n<li>Não consulta volume, TVL, incentivos, custos on-chain nem a segurança dos protocolos. Os únicos dados externos são os preços dos tokens (CoinGecko, com a Binance como alternativa) e, nas pools com endereço de contrato, o preço da pool (DexScreener). A verificação do range compara o preço atual com o range que registou: não lê a posição na blockchain.<\/li>\n<li>A variação não é a impermanent loss isolada: para a medir, é preciso comparar com o valor de manter os mesmos tokens fora da pool.<\/li>\n<li>O APR e o ROI anualizado são simples, sem capitalização, e não são previsões.<\/li>\n<li>A app não regista quantidades de tokens por pool; guarda o valor total em USD.<\/li>\n<\/ul>\n<p>A app ainda não mede a perda impermanente isolada nem conhece as quantidades de tokens de cada posição: o resultado em caixa, com as taxas, e a comparação com ter ficado quieto são um projeto em estudo. Por agora as taxas só se somam, não entram no ROI.<\/p>\n" };

// Instruções dentro da própria app (guia rápido e manual completo), para funcionarem sem internet.
function abrirAjuda(qual) {
  const velho = document.getElementById('ajuda'); if (velho) velho.remove();
  const ov = document.createElement('div'); ov.className = 'ajuda'; ov.id = 'ajuda';
  ov.innerHTML = `<div class="aj-bar"><div class="aj-tabs"><button type="button" data-aj="guia">Guia rápido</button><button type="button" data-aj="manual">Manual completo</button></div><select class="aj-idx" aria-label="Ir para a secção"></select><button type="button" class="btn sm" data-aj="x">Fechar</button></div><div class="aj-body" id="aj-body"></div>`;
  document.body.appendChild(ov);
  const corpo = ov.querySelector('#aj-body'), idx = ov.querySelector('.aj-idx');
  const onKey = e => { if (e.key === 'Escape') fecha(); };
  const fecha = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  const mostra = k => {
    corpo.innerHTML = AJUDA[k] || '<p>Esta cópia da app não traz as instruções embutidas.</p>';
    corpo.scrollTop = 0;
    ov.querySelectorAll('.aj-tabs button').forEach(b => b.classList.toggle('on', b.dataset.aj === k));
    const hs = [...corpo.querySelectorAll('h2, h3')];
    hs.forEach((h, i) => { h.id = 'ajh' + i; });
    idx.innerHTML = '<option value="">Ir para…</option>' + hs.map((h, i) => `<option value="ajh${i}">${h.tagName === 'H3' ? '\u2003' : ''}${esc(h.textContent)}</option>`).join('');
    idx.hidden = hs.length < 4;
  };
  ov.querySelectorAll('[data-aj]').forEach(b => b.addEventListener('click', () => { if (b.dataset.aj === 'x') fecha(); else mostra(b.dataset.aj); }));
  idx.addEventListener('change', () => { const el = idx.value && corpo.querySelector('#' + idx.value); if (el) el.scrollIntoView({ block: 'start' }); idx.value = ''; });
  document.addEventListener('keydown', onKey);
  mostra(qual === 'manual' ? 'manual' : 'guia');
}

function methodHTML() {
  return `<details class="section method"><summary>Como os indicadores são calculados</summary><ul>
    <li><b>Valor Atual</b>: último valor da posição informado em “Atualizar” (sem as fees pendentes). Reforços e retiradas ajustam esse valor de imediato.</li>
    <li><b>Capital investido</b> = liquidez inicial + reforços − retiradas.</li>
    <li><b>Variação da posição</b> = Valor atual − Capital investido. Mostra a diferença em USD face ao capital líquido aportado, mas <b>não mede a impermanent loss isoladamente</b>: para isso seria necessário comparar com o valor de manter os mesmos tokens fora da pool.</li>
    <li><b>Fees Acumuladas</b> = fees ainda não recolhidas, informadas a cada atualização. <b>Recolher Fees</b> passa esse valor para “recolhidas”.</li>
    <li><b>Mover range (rebalance)</b>: regista o novo intervalo de preço, o valor da posição depois da operação e as fees recolhidas no processo. O capital investido não muda; as fees pendentes passam a zero e o valor/fees entram no histórico como nos outros lançamentos. Gas e slippage não são descontados automaticamente.</li>
    <li><b>Resultado registado</b> = Variação + fees recolhidas + fees pendentes. <b>ROI total</b> = resultado registado ÷ capital médio. Não desconta gas, slippage, bridge, impostos ou custo de oportunidade.</li>
    <li><b>Capital médio</b> = capital investido ponderado pelo tempo em que ficou aplicado. Sem reforços ou retiradas, é igual à liquidez inicial.</li>
    <li><b>APR (fees)</b> = fees totais reportadas ÷ capital médio × 365 ÷ dias, sem capitalização. O cálculo usa o período registado até ao último lançamento e não é uma previsão; só é exibido com pelo menos 1 dia de histórico, pois janelas curtas produzem percentagens muito elevadas. A data do último lançamento nem sempre substitui a necessidade de atualizar regularmente o valor e as fees.</li>
    <li><b>ROI anualizado</b> = ROI × 365 ÷ dias (anualização simples, sem capitalização).</li>
    <li><b>APR Médio</b> da carteira = média dos APRs ponderada pelo capital médio de cada pool. Pools que ainda não têm nenhuma atualização ficam fora dessa média. Os cartões e o gráfico da carteira seguem o filtro selecionado (Todas, Ativas ou Fechadas) e o filtro por rede (clique no nome da rede no resumo).</li>
    <li>Cada lançamento fica gravado com data e hora. Para corrigir um lançamento, elimine-o na tabela “Lançamentos” e registe-o de novo. Pode lançar datas passadas, e o histórico é reordenado automaticamente.</li>
  </ul></details>`;
}
function kindTabsHTML(c) {
  const tab = (k, nome, n) => `<button class="ktab${UI.kind === k ? ' on' : ''}" data-act="kind" data-k="${k}">${esc(nome)}<span class="n">${n}</span></button>`;
  const sub = (v, nome, n) => `<button class="vtab${UI.vsub === v ? ' on' : ''}" data-act="vsub" data-k="${v}">${esc(nome)}<span class="n">${n}</span></button>`;
  const chip = (act, k, nome, n, on) => `<button class="vtab lvl${on ? ' on' : ''}" data-act="${act}" data-k="${esc(k)}">${esc(nome)}${n != null ? `<span class="n">${n}</span>` : ''}</button>`;
  let linhas = `<div class="ktabs" role="tablist">${tab('pool', 'Pools de liquidez', c.pool)}${tab('vault', 'Vaults', c.farm + c.com)}</div>`;
  if (UI.kind !== 'vault') return linhas;
  linhas += `<div class="vtabs">${sub('farm', 'Auto-Farms', c.farm)}${sub('com', 'Vaults Comunitários', c.com)}</div>`;
  const vs = vaultList();
  if (vs.length > 1) {   // linha dos vaults, só quando há mais de um
    linhas += `<div class="vtabs lvl2">${chip('vsel', '', 'Todos', vs.reduce((a, [, ps]) => a + ps.length, 0), !UI.vsel)}${vs.map(([k, ps]) => chip('vsel', k, vaultNome(k), ps.length, UI.vsel === k)).join('')}</div>`;
  }
  const dentro = UI.vsel ? (vs.find(([k]) => k === UI.vsel) || [, []])[1] : (vs.length === 1 ? vs[0][1] : []);
  if (dentro.length > 1) {   // linha das posições desse vault
    linhas += `<div class="vtabs lvl3">${chip('psel', '', 'Todas', dentro.length, !UI.psel)}${dentro.map(p => chip('psel', p.id, poolName(p), null, UI.psel === p.id)).join('')}</div>`;
  }
  return linhas;
}
function render() {
  const app = $('#app');
  const todas = DB.pools.map(p => ({ p, r: compute(p) }));
  CACHE = {}; todas.forEach(x => CACHE[x.p.id] = x);
  const counts = { pool: 0, farm: 0, com: 0 };
  DB.pools.forEach(p => counts[grupoOf(p)]++);
  const all = todas.filter(x => naVista(x.p));   // cada separador vive isolado dos outros
  const nAt = all.filter(x => x.r.cur && !x.r.st.closed).length, nFe = all.filter(x => x.r.st.closed).length;
  const statusList = all.filter(x => x.r.cur && (UI.filter === 'todas' || (UI.filter === 'ativas' ? !x.r.st.closed : x.r.st.closed)));
  let list = statusList.filter(x => {
    if (UI.rede && String(x.p.rede || '').trim().toLocaleLowerCase() !== UI.rede.toLocaleLowerCase()) return false;
    if (UI.exchange && String(x.p.exchange || '').trim().toLocaleLowerCase() !== UI.exchange.toLocaleLowerCase()) return false;
    return true;
  });
  const sortFn = {
    recent: (a, b) => (a.r.st.closed - b.r.st.closed) || (b.r.st.start - a.r.st.start),
    valor: (a, b) => (b.r.cur?.valor || 0) - (a.r.cur?.valor || 0),
    roi: (a, b) => (b.r.cur?.ganho || 0) - (a.r.cur?.ganho || 0),
    apr: (a, b) => { const x = a.r.cur?.apr, y = b.r.cur?.apr; if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1; return y - x; },
    fees: (a, b) => (b.r.cur?.feesTot || 0) - (a.r.cur?.feesTot || 0)
  };
  list = list.sort(sortFn[UI.sort] || sortFn.recent);
  PSERIES = portfolioSeries(list);
  app.innerHTML = headerHTML() + `<div id="banner">${bannerHTML()}</div>` + kindTabsHTML(counts) +
    (all.length ? cardsHTML(aggregate(list.map(x => x.r.cur))) + networkSummaryHTML(statusList) + insightsHTML(list) + portfolioHTML() + poolsHTML(list, all.length, nAt, nFe) + tokensHTML() : emptyHTML()) +
    methodHTML() + (all.length ? practicesHTML() : '') + footerHTML();
  drawCharts();
}

/* ---------- formulários ---------- */
function fieldHTML(f) {
  const v = f.type === 'num' ? numToInput(f.value) : (f.value ?? '');
  let inp;
  if (f.type === 'check') return `<div class="f ${f.half ? 'half' : ''} fcheck"><label class="chk"><input type="checkbox" name="${f.name}"${f.value ? ' checked' : ''}><span>${esc(f.label)}</span></label>${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}</div>`;
  if (f.type === 'select') inp = `<select name="${f.name}">${f.options.map(([k, l]) => `<option value="${k}"${k === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  else if (f.type === 'textarea') inp = `<textarea name="${f.name}" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>`;
  else inp = `<input name="${f.name}" ${f.type === 'num' ? 'type="text" inputmode="decimal" autocomplete="off"' : f.digits ? 'type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off"' : `type="${f.type || 'text'}"`} value="${esc(v)}" placeholder="${esc(f.ph || '')}"${f.maxlen ? ` maxlength="${+f.maxlen}" autocomplete="off" spellcheck="false"` : ''}${f.short ? ' class="short"' : ''}>`;
  return `<div class="f ${f.half ? 'half' : ''}${f.dt ? ' dt' : ''}"><label>${esc(f.label)}${f.type === 'num' ? '<span class="prev"></span>' : ''}</label>${inp}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}</div>`;

function dialog({ title, message, ok = 'OK', cancel = 'Cancelar', danger = false, input = null, confirmWord = null, choices = null, pick = null }) {
  return new Promise(resolve => {

    const msg = String(message || '').split('\n').map(esc).join('<br>');
    const need = confirmWord ? String(confirmWord).toLowerCase() : null;   // segurança extra: obriga a escrever uma palavra
    const field = input || need;
    ov.innerHTML = `<div class="modal" role="alertdialog" aria-modal="true" aria-label="${esc(title)}" style="width:min(440px,100%)"><div class="mh"><h3>${esc(title)}</h3></div>
      <div class="mb"><p class="dlg-msg">${msg}</p>${choices ? `<div class="picks">${choices.map(([k, t, d]) => `<button type="button" class="pick${k === pick ? ' on' : ''}" data-pick="${esc(k)}"><b>${esc(t)}</b>${d ? `<span>${esc(d)}</span>` : ''}</button>`).join('')}</div>` : ''}${need ? `<p class="dlg-msg" style="margin-top:12px">Para confirmar, escreva <b>“${esc(confirmWord)}”</b> no campo abaixo.</p>` : ''}${field ? `<input class="dlg-in" type="text" value="${esc(input ? (input.value || '') : '')}" placeholder="${esc(input ? (input.ph || '') : confirmWord)}" autocomplete="off" autocapitalize="none" spellcheck="false" style="width:100%;margin-top:12px">` : ''}
      <div class="mf" style="margin-top:16px">${cancel ? `<button type="button" class="btn" data-r="no">${esc(cancel)}</button>` : ''}${choices ? '' : `<button type="button" class="btn ${danger ? 'red' : 'primary'}" data-r="yes"${need ? ' disabled' : ''}>${esc(ok)}</button>`}</div></div></div>`;
    document.body.appendChild(ov);
    const inp = ov.querySelector('.dlg-in'), yesBtn = ov.querySelector('[data-r="yes"]'), nb = ov.querySelector('[data-r="no"]');
    ov.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => done(b.dataset.pick)));
    const okNow = () => !need || inp.value.trim().toLowerCase() === need;
    const done = v => { ov.remove(); document.removeEventListener('keydown', onKey, true); resolve(v); };
    const yes = () => { if (okNow()) done(input ? inp.value : true); }, no = () => done(input || choices ? null : false);
    const onKey = e => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); no(); }
      else if (e.key === 'Enter' && inp && document.activeElement === inp) { e.preventDefault(); e.stopImmediatePropagation(); yes(); }
    };
    document.addEventListener('keydown', onKey, true);
    if (need) inp.addEventListener('input', () => { yesBtn.disabled = !okNow(); });
    ov.addEventListener('click', e => { if (e.target === ov) no(); });   // clicar fora = cancelar
    if (yesBtn) yesBtn.addEventListener('click', yes);
    if (nb) nb.addEventListener('click', no);
    (inp || (choices ? ov.querySelector('[data-pick]') : null) || (danger && nb) || yesBtn).focus();   // em ações destrutivas o foco inicial é “Cancelar” (ou o campo de texto)
  });
}

      { name: 'rangeMin', label: 'Novo range mínimo', type: 'num', money: false, ph: ok(P.rangeMin) ? 'anterior: ' + fmtNum(P.rangeMin) : '3000', half: 1, req: 1 },
      { name: 'rangeMax', label: 'Novo range máximo', type: 'num', money: false, ph: ok(P.rangeMax) ? 'anterior: ' + fmtNum(P.rangeMax) : '4000', half: 1, req: 1 },
      ...dtFields(),
      taxaField(),
      ...notaField(P)
    ],
    note: 'Regista a mudança de range (rebalance). O capital investido não muda — só o valor da posição e as fees recolhidas. Gas, slippage e bridge não são descontados automaticamente. O range atual da pool passa a ser o novo.',
    onSubmit: v => {
      const tt = v.data + 'T' + v.hora, er = checkDate(P, tt); if (er) return er;
      if (v.valor < 0 || v.fees < 0) return 'Os valores não podem ser negativos.';
      if (!(v.rangeMin < v.rangeMax)) return 'O range mínimo deve ser menor que o máximo.';
      const prevMin = P.rangeMin, prevMax = P.rangeMax;
      P.rangeMin = v.rangeMin;
      P.rangeMax = v.rangeMax;
      P.events.push({ id: uid(), type: 'rebalance', t: tt, valor: v.valor, fees: v.fees, rangeMin: v.rangeMin, rangeMax: v.rangeMax, prevMin, prevMax, hash: v.hash || null, nota: v.nota || null, taxa: ok(v.taxa) ? v.taxa : null, expr: v.__expr || null, seq: nextSeq() });
      save();
    }
  });
}
function collectForm(P) {
  const c = CACHE[P.id].r.cur;
  openForm({
    title: 'Recolher Fees - ' + poolName(P), submit: 'Registar recolha',
    fields: [...refField(P), { name: 'valor', label: 'Valor recolhido (USD)', type: 'num', value: c.pend, req: 1, hint: 'Esse valor sai de “Fees Acumuladas” e passa para “Fees Recolhidas”. O ROI não muda.' }, ...dtFields(), taxaField(), ...notaField(P)],
    onSubmit: v => {
      const tt = v.data + 'T' + v.hora, er = checkDate(P, tt); if (er) return er;
      if (!(v.valor > 0)) return 'Informe um valor maior que zero.';
      P.events.push({ id: uid(), type: 'coleta', t: tt, valor: v.valor, fees: null, hash: v.hash || null, nota: v.nota || null, taxa: ok(v.taxa) ? v.taxa : null, expr: v.__expr || null, seq: nextSeq() }); save();
    }
  });
}
function flowForm(P) {
  const c = CACHE[P.id].r.cur;
  openForm({
    title: 'Reforço / Retirada - ' + poolName(P), submit: 'Registar',
    fields: [
      ...refField(P),
      { name: 'tipo', label: 'Movimento', type: 'select', value: 'aporte', options: [['aporte', 'Reforço (adicionar liquidez)'], ['retirada', 'Retirada parcial de liquidez']] },
      { name: 'valor', label: 'Valor (USD)', type: 'num', req: 1, hint: 'Valor em USD no momento da movimentação.' },
      ...dtFields(),
      taxaField(),
      ...notaField(P)
    ],
    note: 'O valor atual da posição é ajustado automaticamente, e o ROI e o APR passam a usar o capital médio ponderado pelo tempo. Para retirar tudo, use “Fechar Pool”.',
    onSubmit: v => {
      const tt = v.data + 'T' + v.hora, er = checkDate(P, tt); if (er) return er;
      if (!(v.valor > 0)) return 'Informe um valor maior que zero.';
      if (v.tipo === 'retirada' && v.valor >= c.valor) return `A retirada (${money(v.valor)}) não pode ser igual ou maior que o valor atual (${money(c.valor)}). Para retirar tudo, use “Fechar Pool”.`;
      P.events.push({ id: uid(), type: v.tipo, t: tt, valor: v.valor, fees: null, hash: v.hash || null, nota: v.nota || null, taxa: ok(v.taxa) ? v.taxa : null, expr: v.__expr || null, seq: nextSeq() }); save();
    }
  });
}
function closeForm(P) {
  const c = CACHE[P.id].r.cur;
  openForm({
    title: 'Fechar Pool - ' + poolName(P), submit: 'Fechar Pool',
    fields: [
      ...refField(P),
      { name: 'valor', label: 'Valor final recebido (USD)', type: 'num', ph: '0,00', req: 1, hint: 'Valor da liquidez retirada no fecho, sem as fees.' },
      { name: 'fees', label: 'Fees recebidas no fecho (USD)', type: 'num', ph: '0,00', req: 1, hint: 'Fees pendentes que foram recolhidas junto com o fecho.' },
      ...dtFields(),
      taxaField(),
      ...notaField(P)
    ],
    note: 'Depois de fechada, a pool para de contar dias: ROI e APR ficam congelados na data do fecho. Se necessário, é possível reabri-la.',
    onSubmit: v => {
      const tt = v.data + 'T' + v.hora, er = checkDate(P, tt); if (er) return er;
      if (parseT(tt) < CACHE[P.id].r.st.last) return `O fecho não pode ser anterior ao último lançamento (${fmtDT(CACHE[P.id].r.st.last)}).`;
      if (v.valor < 0 || v.fees < 0) return 'Os valores não podem ser negativos.';
      P.events.push({ id: uid(), type: 'fechamento', t: tt, valor: v.valor, fees: v.fees, hash: v.hash || null, nota: v.nota || null, taxa: ok(v.taxa) ? v.taxa : null, expr: v.__expr || null, seq: nextSeq() }); save();
    }
  });
}

/* ---------- eventos ---------- */
document.addEventListener('click', ev => {
  const menu = $('#menu');
  const b = ev.target.closest('[data-act]');
  if (menu && !menu.hidden && (!ev.target.closest('.menu-wrap') || ev.target.closest('#menu'))) menu.hidden = true;   // fecha o menu ao escolher um item
  if (!b) return;
  const act = b.dataset.act, id = b.dataset.id, P = id ? DB.pools.find(p => p.id === id) : null;
  if (menu && b.closest('.menu')) menu.hidden = true;
  switch (act) {
    case 'menu': menu.hidden = !menu.hidden; break;
    case 'new': newPoolFlow(); break;
    case 'kind': UI.kind = b.dataset.k; UI.vsel = null; UI.psel = null; UI.filter = 'todas'; UI.rede = null; UI.exchange = null; render(); break;
    case 'vsub': UI.vsub = b.dataset.k; UI.vsel = null; UI.psel = null; UI.filter = 'todas'; UI.rede = null; UI.exchange = null; render(); break;
    case 'vsel': UI.vsel = b.dataset.k || null; UI.psel = null; UI.filter = 'todas'; render(); break;
    case 'psel': UI.psel = b.dataset.k || null; UI.filter = 'todas'; render(); break;
    case 'toggle': {
      UI.open[id] = !UI.open[id];
      render();
      if (UI.open[id]) setTimeout(() => { const el = document.getElementById('pool-' + id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 40);
      break;
    }
    case 'tab': UI.tab[id] = b.dataset.k; drawCharts(); b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); break;
    case 'ptab': UI.ptab = b.dataset.k; drawCharts(); b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); break;
    case 'filter': UI.filter = UI.filter === b.dataset.k ? 'todas' : b.dataset.k; render(); break;
    case 'filter-rede': {
      const k = (b.dataset.k || '').trim();
      UI.rede = (!k || (UI.rede && UI.rede.toLocaleLowerCase() === k.toLocaleLowerCase())) ? null : k;
      render();
      break;
    }
    case 'filter-ex': {
      const k = (b.dataset.k || '').trim();
      UI.exchange = (!k || (UI.exchange && UI.exchange.toLocaleLowerCase() === k.toLocaleLowerCase())) ? null : k;
      render();
      break;
    }
    case 'sort': UI.sort = b.dataset.k || 'recent'; render(); break;
    case 'scroll': {
      const map = { pools: 'sec-pools', cross: 'sec-cross', matrix: 'sec-matrix', ranks: 'sec-ranks', port: 'sec-port', pairs: 'sec-pairs' };
      const el = document.getElementById(map[b.dataset.k] || b.dataset.k);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      break;
    }
    case 'update': updateForm(P); break;
    case 'rebalance': if (kindOf(P) !== 'farm') rebalanceForm(P); break;
    case 'quota': if (P && ok(P.pct)) quotaForm(P); break;
    case 'collect': collectForm(P); break;
    case 'flow': flowForm(P); break;
    case 'close': closeForm(P); break;
    case 'edit': poolForm(P); break;
    case 'reopen':
      askConfirm('Reabrir pool', `Reabrir “${poolName(P)}”? O lançamento de fecho será removido.`, 'Reabrir', false).then(yes => { if (yes) { P.events = P.events.filter(e => e.type !== 'fechamento'); save(); } });
      break;
    case 'delpool':
      askConfirm('Eliminar pool', `Eliminar a pool “${poolName(P)}” e todo o seu histórico (${P.events.length} lançamentos)?\n\nIsto não pode ser desfeito, a não ser que tenha um backup.`, 'Eliminar', true, 'eliminar').then(yes => { if (yes) { DB.pools = DB.pools.filter(p => p !== P); save(); } });
      break;
    case 'evedit': { const e = P && P.events.find(x => x.id === b.dataset.ev); if (e) editEventForm(P, e); break; }
    case 'delev': {
      const e = P.events.find(x => x.id === b.dataset.ev);
      if (!e) break;
      askConfirm('Eliminar lançamento', `Eliminar o lançamento “${TYPE_LABEL[e.type]}” de ${fmtDT(parseT(e.t))}?\n\nO ROI, o APR e os gráficos da pool recalculam-se sem ele.`, 'Eliminar').then(yes => {
        if (!yes) return;
        P.events = P.events.filter(x => x !== e);
        if (e.type === 'par') {
          const pars = sortedEvents(P).filter(x => x.type === 'par');
          if (pars.length) { P.token1 = pars[pars.length - 1].token1; P.token2 = pars[pars.length - 1].token2; }
          else if ('prevT1' in e) { P.token1 = e.prevT1; P.token2 = e.prevT2; }
        }
        if (e.type === 'rebalance') {
          const rebs = sortedEvents(P).filter(x => x.type === 'rebalance');
          if (rebs.length) { P.rangeMin = rebs[rebs.length - 1].rangeMin; P.rangeMax = rebs[rebs.length - 1].rangeMax; }
          else if ('prevMin' in e) { P.rangeMin = e.prevMin; P.rangeMax = e.prevMax; }
        }
        UI.open[P.id + ':ev'] = true;
        save();
      });
      break;
    }
    case 'link': linkNewFile(); break;
    case 'open-file': openExistingFile(); break;
    case 'unlink': unlinkFile(); break;
    case 'reconnect': reconnectFile(); break;
    case 'allev': UI.allev[id] = !UI.allev[id]; UI.open[id + ':ev'] = true; render(); break;
    case 'nofile': askNotice('Este navegador não deixa a app gravar diretamente num ficheiro seu. É o caso do Safari, do Firefox e das apps instaladas no telemóvel.\n\nPara ter o ficheiro de dados, abra a app no Chrome ou no Edge, num computador.\n\nAqui, use Exportar backup com regularidade: é a forma de não perder nada.', 'Ficheiro de dados'); break;
    case 'parc': {   // toque na célula: mostra as parcelas (no telemóvel não há rato)
      const ps = parcelas(b.dataset.e), money2 = x => money(parseNum(x, true));
      askNotice(ps.map(x => '• ' + x.replace('.', ',') + '  =  ' + money2(x)).join('\n') + `\n\nTotal: ${money(parseNum(b.dataset.e, true))}`, (b.dataset.l || 'Valor') + ': ' + ps.length + ' parcelas');
      break;
    }
    case 'nicks': nicksForm(); break;
    case 'ajuda': abrirAjuda(b.dataset.k); break;
    case 'pwa': pwaForm(); break;
    case 'pwa-install': pwaInstalar(); break;
    case 'carteiras': carteirasForm(); break;
    case 'nick-tipo': { const k = nickKey(b.dataset.a); DB.nickKind = DB.nickKind || {}; if (DB.nickKind[k] === 'carteira') delete DB.nickKind[k]; else DB.nickKind[k] = 'carteira'; save(); nicksForm(); break; }
    case 'wal-add': walEdit(''); break;
    case 'wal-edit': walEdit(b.dataset.a); break;
    case 'wal-del': { const a = b.dataset.a, n = DB.pools.filter(p => nickKey(p.carteira) === a).length; askConfirm('Remover carteira', `Remover “${walletLabel(a)}”?` + (n ? ` ${n} pool(s) deixam de ter carteira associada.` : ''), 'Remover').then(yes => { if (!yes) return; if (DB.wallets) delete DB.wallets[a]; if (String(DB.wallet || '').trim().toLowerCase() === a) delete DB.wallet; DB.pools.forEach(p => { if (nickKey(p.carteira) === a) p.carteira = ''; }); save(); carteirasForm(); }); break; }
    case 'krystal': if (P) krystalForm(P); break;
    case 'nick-add': nickEdit(b.dataset.a || ''); break;
    case 'nick-edit': nickEdit(b.dataset.a); break;
    case 'nick-del': { const a = b.dataset.a; askConfirm('Remover nome', `Remover o nome “${nickOf(a)}” de ${addrCurto(a)}?`, 'Remover').then(yes => { if (yes) { delete DB.nicks[nickKey(a)]; save(); nicksForm(); } }); break; }
    case 'prices': updatePrices(); break;
    case 'reloadapp': location.reload(); break;
    case 'tokid': {
      const k = b.dataset.k, T = (DB.tokens = DB.tokens || {}), o = T[k] || {};
      askInput(`Identificar o token ${k}`, 'Escreva uma de duas coisas:\n• o endereço do contrato do token (0x… ou, na Solana, o endereço do token);\n• ou o ID da CoinGecko (o último segmento do endereço da moeda em coingecko.com, por exemplo coinbase-wrapped-btc).\nDeixe em branco para voltar a procurar pelo símbolo.', o.over || '', '0x… ou coinbase-wrapped-btc').then(v => {
        if (v === null) return;
        const raw = v.trim().replace(/\s+/g, ''), id = isTokenAddr(raw) ? raw : raw.toLowerCase();
        if (id) T[k] = Object.assign({}, o, { over: id, nf: 0, u: Date.now() }); else if (T[k]) { delete T[k].over; T[k].nf = 0; T[k].u = Date.now(); }
        save();
      });
      break;
    }
    case 'cgkey': {
      askInput('Chave API da CoinGecko', 'Chave gratuita (opcional; aumenta o limite de pedidos). Fica só neste dispositivo.\nDeixe em branco para remover.', cgKey(), 'chave API').then(v => {
        if (v === null) return;
        try { v.trim() ? localStorage.setItem('pool-monitor-cgkey', v.trim()) : localStorage.removeItem('pool-monitor-cgkey'); } catch (e) { }
      });
      break;
    }
    case 'export': exportBackup(); break;
    case 'import': importBackup(); break;
    case 'csv-ev': exportEventsCSV(); break;
    case 'csv-pools': exportPoolsCSV(); break;
    case 'wipe':
      askConfirm('Apagar todos os dados', 'Apagar TODAS as pools e lançamentos?\n\nRecomendo exportar um backup antes. Isto não pode ser desfeito.', 'Apagar tudo', true, 'apagar').then(yes => { if (yes) { DB = emptyDB(); FORCE_NEXT = !!(FILE.handle && FILE.state === 'ok'); UI.open = {}; UI.rede = null; UI.exchange = null; save(); } });
      break;
  }
});
document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details[data-evid]')) UI.open[d.dataset.evid + ':ev'] = d.open; }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const m = $('#menu'); if (m) m.hidden = true; } });
let rT = null;
window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(drawCharts, 150); });
window.addEventListener('storage', e => { if (e.key === LS_KEY) { adoptDB(loadLocal()); render(); } });
window.addEventListener('focus', pullFromFile);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pullFromFile(); });

// Se algo correr mal, mostra o erro em vez de deixar o ecrã preto.
function fatal(e) {
  const msg = (e && (e.message || e)) + (e && e.stack ? '\n' + String(e.stack).split('\n').slice(0, 4).join('\n') : '');
  let raw = ''; try { raw = localStorage.getItem(LS_KEY) || ''; } catch (x) { }
  document.body.innerHTML = `<div class="wrap"><div class="fatal"><h2>A app não conseguiu arrancar</h2>
    <p>Versão ${APP_VERSION}. Isto não apaga nada: os seus dados continuam gravados.</p>
    <pre>${esc(msg)}</pre>
    <div class="bb">${raw ? '<button class="btn" id="fx-save">Guardar cópia dos dados</button>' : ''}<button class="btn" id="fx-reload">Tentar de novo</button></div>
    <p class="note">Se voltar a acontecer, guarde a cópia dos dados e envie esta mensagem de erro.</p></div></div>`;
  const sv = document.getElementById('fx-save');
  if (sv) sv.onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([raw], { type: 'application/json' })); a.download = 'pool-monitor-recuperacao.json'; a.click(); };
  document.getElementById('fx-reload').onclick = () => location.reload();
}
window.addEventListener('error', e => { if (!document.querySelector('.brand') && !document.querySelector('.fatal')) fatal(e.error || e.message); });
window.addEventListener('unhandledrejection', e => { if (!document.querySelector('.brand') && !document.querySelector('.fatal')) fatal(e.reason); });

async function init() {
  initUpdateWatch(); initNetWatch(); checkLocalStorage();
  adoptDB(loadLocal());
  render();
  if (!FILE.supported) return;
  try {
    const h = await idbGet('handle');
    if (!h) return;
    FILE.handle = h; FILE.name = h.name;
    if ((await h.queryPermission({ mode: 'readwrite' })) === 'granted') await syncFromFile();
    else FILE.state = 'needs-permission';
  } catch (e) { console.error(e); FILE.state = FILE.handle ? 'error' : 'none'; }
  render();
}
init().catch(fatal);
</script>
<script>
// Modo offline (PWA): só em http(s); abrindo o ficheiro diretamente não faz nada.
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));
}
</script>
