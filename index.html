<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05060a">
<meta name="description" content="Acompanhamento offline de posições de liquidez: ROI, APR e gráficos.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pool Monitor">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Pool Monitor</title>
<style>
:root{
  --bg:#05060a; --bg2:#080a10; --panel:#0c0f18; --card:#111520; --card2:#161b28; --elev:#1a2030;
  --border:#1e2536; --border2:#2a3348;
  --text:#eef0f6; --muted:#8b93a7; --dim:#5c6478;
  --blue:#4f7cff; --blue2:#6b93ff; --green:#22c55e; --green2:#4ade80; --red:#f04352; --yellow:#f5c518;
  --purple:#a78bfa; --cyan:#38bdf8; --inv:#60a5fa; --orange:#fb923c;
  --glow-blue:rgba(79,124,255,.18); --glow-green:rgba(34,197,94,.14); --glow-red:rgba(240,67,82,.12);
  --radius:14px; --radius-sm:10px; --shadow:0 8px 32px rgba(0,0,0,.45);
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:smooth}
body{margin:0;background:radial-gradient(1200px 600px at 10% -10%,rgba(79,124,255,.07),transparent 50%),radial-gradient(900px 500px at 90% 0%,rgba(167,139,250,.05),transparent 45%),var(--bg);color:var(--text);font:14px/1.45 var(--font);min-height:100vh}
button{font:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:16px 16px 60px}

/* —— Top bar —— */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#4f7cff 0%,#a78bfa 100%);display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;box-shadow:0 4px 16px rgba(79,124,255,.35);flex:none}
h1{font-size:22px;margin:0;font-weight:750;letter-spacing:-.02em}
.subt{color:var(--muted);margin-top:1px;font-size:12.5px}
.top-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card2);color:var(--text);padding:8px 13px;border-radius:11px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s ease}
.btn:hover{border-color:var(--border2);background:var(--elev);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,#4f7cff,#3b6dff);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(79,124,255,.3)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.green{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.32);color:var(--green2)}
.btn.red{background:rgba(240,67,82,.12);border-color:rgba(240,67,82,.35);color:#ff8a94}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:9px}
.status{font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border:1px solid var(--border);border-radius:999px;background:rgba(255,255,255,.02);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--yellow);flex:none;box-shadow:0 0 0 3px rgba(245,197,24,.15)}
.dot.ok{background:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.15)}
.dot.err{background:var(--red);box-shadow:0 0 0 3px rgba(240,67,82,.15)}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:#0e121c;border:1px solid var(--border);border-radius:14px;padding:6px;min-width:300px;z-index:40;box-shadow:var(--shadow)}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);padding:9px 12px;border-radius:9px;cursor:pointer;transition:background .12s}
.menu button:hover{background:var(--card2)}
.menu button.danger{color:#ff8a94}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 0}
.menu .cap{color:var(--dim);font-size:11px;padding:4px 12px;text-transform:uppercase;letter-spacing:.06em;font-weight:650}
.banner{border:1px solid var(--border);background:var(--card);border-radius:12px;padding:11px 14px;margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.banner.warn{border-color:rgba(245,197,24,.35);color:#fde68a;background:rgba(245,197,24,.05)}
.banner .bb{display:flex;gap:8px}

/* —— KPI cards —— */
.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:12px}
@media (max-width:1200px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card .val{font-size:18px}}
.card{background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 40%),var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 15px;position:relative;overflow:hidden;transition:border-color .15s,transform .15s}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--blue));opacity:.85}
.card:hover{border-color:var(--border2);transform:translateY(-2px)}
.card .lbl{color:var(--muted);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card .val{font-size:22px;font-weight:750;margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.card .s{color:var(--dim);font-size:11.5px;margin-top:3px}

/* —— Dashboard sections —— */
.dash-section{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-top:10px;transition:border-color .15s}
.dash-section:hover{border-color:var(--border2)}
.dash-title{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.dash-title h2{font-size:15px;margin:0;font-weight:700;letter-spacing:-.01em}
.dash-title p{margin:3px 0 0;color:var(--muted);font-size:12px}
.dash-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.insight-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;min-width:0;cursor:default;transition:border-color .15s,background .15s}
.insight-card.clickable{cursor:pointer}
.insight-card.clickable:hover{border-color:rgba(79,124,255,.4);background:rgba(79,124,255,.06)}
.insight-card .ilabel{color:var(--muted);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.insight-card .ivalue{font-size:20px;font-weight:750;margin-top:4px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.insight-card .idetail{color:var(--dim);font-size:12px;margin-top:3px;overflow-wrap:anywhere}
.insight-card .iname{color:var(--text);font-weight:650}

/* Cross data grid */
.cross{display:grid;grid-template-columns:1.15fr 1fr;gap:10px;margin-top:10px}
@media (max-width:900px){.cross{grid-template-columns:1fr}}
.cross-panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 14px}
.cross-panel h2{font-size:15px;margin:0 0 4px;font-weight:700}
.cross-panel .sub{color:var(--muted);font-size:12px;margin-bottom:12px}

/* Network bars */
.bar-row{display:grid;grid-template-columns:minmax(110px,130px) 1fr 68px;gap:8px;align-items:center;padding:5px 6px;border-radius:8px;cursor:pointer;transition:background .12s;margin-bottom:1px}
.bar-row:hover,.bar-row.on{background:rgba(79,124,255,.08)}
.bar-row .bn{font-weight:650;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:8px;background:rgba(255,255,255,.04);border-radius:999px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#4f7cff,#a78bfa);min-width:2px;transition:width .35s ease}
.bar-val{font-size:12px;font-weight:650;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}

/* Mini rank list */
.rank-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;transition:background .12s;border:1px solid transparent}
.rank-item:hover{background:rgba(255,255,255,.03);border-color:var(--border)}
.rank-num{width:22px;height:22px;border-radius:7px;background:var(--elev);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);flex:none}
.rank-num.t1{background:rgba(245,197,24,.15);color:var(--yellow)}
.rank-num.t2{background:rgba(148,163,184,.12);color:#cbd5e1}
.rank-num.t3{background:rgba(180,120,60,.15);color:#d4a574}
.rank-body{flex:1;min-width:0}
.rank-body b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-body span{font-size:11.5px;color:var(--dim)}
.rank-metric{text-align:right;font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums;flex:none}

.dash-table-wrap{overflow-x:auto;margin-top:8px;border-radius:10px}
.dash-table{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
.dash-table th,.dash-table td{padding:9px 11px;border-bottom:1px solid var(--border);text-align:right}
.dash-table th{color:var(--muted);font-weight:650;background:rgba(255,255,255,.02);font-size:11px;text-transform:uppercase;letter-spacing:.03em}
.dash-table th:first-child,.dash-table td:first-child,.dash-table th:nth-child(2),.dash-table td:nth-child(2){text-align:left}
.dash-table tbody tr{transition:background .12s;cursor:default}
.dash-table tbody tr:hover{background:rgba(255,255,255,.02)}
.dash-table tbody tr.on{background:rgba(79,124,255,.08)}
.dash-table tfoot td{font-weight:750;border-top:1px solid var(--border2);color:var(--text)}
.text-link{border:0;background:none;color:var(--blue2);font:inherit;font-weight:650;cursor:pointer;padding:0;text-align:left;transition:color .12s}
.text-link:hover{color:#a5c0ff;text-decoration:underline}
.net{display:inline-flex;align-items:center;gap:6px;vertical-align:middle}
.net-ico{display:inline-grid;place-items:center;width:1.35em;height:1.35em;font-size:13px;line-height:1;flex:none;opacity:.95}
.net-img{width:18px;height:18px;border-radius:5px;object-fit:contain;flex:none;background:rgba(255,255,255,.04);box-shadow:0 0 0 1px rgba(255,255,255,.06)}
.bar-row .net-img,.dash-table .net-img{width:18px;height:18px}
.bar-row .net-ico,.dash-table .net-ico{font-size:14px}
.pname .net{margin-left:2px}
.chip .net-img{width:16px;height:16px;border-radius:4px}
.state-tag{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:2px 8px;font-size:10.5px;color:var(--muted);font-weight:600}
.state-tag.good{color:var(--green2);border-color:rgba(34,197,94,.3);background:rgba(34,197,94,.08)}
.state-tag.warn{color:var(--yellow);border-color:rgba(245,197,24,.3);background:rgba(245,197,24,.08)}
.state-tag.bad{color:#ff8a94;border-color:rgba(240,67,82,.3);background:rgba(240,67,82,.08)}
.alert-list{display:grid;gap:5px;margin-top:6px}
.alert-item{display:flex;align-items:flex-start;gap:9px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--muted);font-size:12.5px;transition:border-color .12s}
.alert-item:hover{border-color:var(--border2)}
.alert-item b{color:var(--text)}
.alert-icon{font-size:13px;line-height:1.3;flex:none;opacity:.9}
.dash-footnote{color:var(--dim);font-size:11.5px;line-height:1.5;margin:10px 0 0}
.practices-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.practice{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 12px}
.practice b{display:block;color:var(--text);margin-bottom:3px;font-size:13px}
.practice span{display:block;color:var(--muted);font-size:12px}
@media(max-width:800px){.dash-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.dash-grid,.practices-grid{grid-template-columns:1fr}.dash-section,.cross-panel{padding:14px}}

.pos{color:var(--green)} .neg{color:var(--red)} .neu{color:var(--text)} .apr{color:var(--purple)} .fee{color:var(--yellow)} .inv{color:var(--inv)} .roi{color:var(--cyan)}

/* —— Sections & pools —— */
.section{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-top:10px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sec-head h2{font-size:15px;margin:0;font-weight:700}
.sec-head .hs{color:var(--dim);font-size:12px;margin-left:6px;font-weight:400}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--card2);color:var(--muted);padding:5px 12px;border-radius:999px;cursor:pointer;font-weight:600;font-size:12.5px;transition:all .12s}
.chip:hover{border-color:var(--border2);color:var(--text)}
.chip.on{color:var(--text);border-color:#3a4660;background:rgba(255,255,255,.05)}
.chip.g.on{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.35);color:var(--green2)}

.pool{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-top:8px;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.pool:hover{border-color:var(--border2)}
.pool.open{border-color:rgba(79,124,255,.35);box-shadow:0 0 0 1px rgba(79,124,255,.12)}
.pool.closed{opacity:.88}
.pool-head{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;flex-wrap:wrap;transition:background .12s}
.pool-head:hover{background:rgba(255,255,255,.02)}
.avatar{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#1a2342,#243056);color:#9bb4ff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.pname{flex:1;min-width:150px}
.pname b{font-size:14.5px}
.pname .ps{color:var(--muted);font-size:12px;margin-top:1px}
.badge{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:999px;font-weight:650;margin-left:5px;vertical-align:2px}
.badge.ativa{background:rgba(34,197,94,.12);color:var(--green2)}
.badge.fechada{background:#262b3a;color:#c3c8d4}
.badge.warn{background:rgba(245,197,24,.1);color:var(--yellow)}
.metrics{display:flex;gap:16px;flex-wrap:wrap;justify-content:flex-end}
.m{text-align:right;min-width:72px}
.m span{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.m b{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.m i{display:block;font-style:normal;font-size:11px;color:var(--dim)}
.chev{width:32px;height:32px;border-radius:9px;border:0;background:var(--elev);color:var(--inv);cursor:pointer;flex:none;display:grid;place-items:center;transition:transform .2s,background .12s}
.pool.open .chev{background:rgba(79,124,255,.15)}
.pool.open .chev svg{transform:rotate(180deg)}
.pool-body{border-top:1px solid var(--border);padding:14px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--card2);border-radius:10px;padding:9px 11px;border:1px solid transparent}
.tile span{color:var(--muted);font-size:11px;display:block;font-weight:600}
.tile b{font-size:14.5px;font-variant-numeric:tabular-nums}
.tile i{display:block;font-style:normal;color:var(--dim);font-size:11px;margin-top:1px}
.obs{color:var(--muted);font-size:12.5px;margin-top:10px;padding:8px 10px;background:rgba(255,255,255,.02);border-radius:8px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
.hist-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;border-top:1px solid var(--border);padding-top:12px}
.hist-head .ht{color:var(--muted);font-weight:600;font-size:13px}
.seg{display:inline-flex;background:var(--card2);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{background:none;border:0;color:var(--muted);padding:5px 11px;border-radius:8px;font-weight:600;font-size:12.5px;cursor:pointer;transition:all .12s}
.seg button.on{background:rgba(34,197,94,.14);color:var(--green2)}
.chart{position:relative;margin-top:8px;min-height:100px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:#1e2536;stroke-dasharray:3 4}
.chart .zl{stroke:#2a3348}
.chart .ax{fill:#6b7289;font-size:10.5px}
.chart .guide{stroke:#4a5568;stroke-dasharray:3 3}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.legend i,.tip i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.tip{position:absolute;pointer-events:none;background:#0a0d14;border:1px solid var(--border);border-radius:9px;padding:7px 10px;font-size:12px;white-space:nowrap;display:none;z-index:3;box-shadow:var(--shadow)}
.tip .tt{color:var(--muted);margin-bottom:3px}
.nochart{color:var(--dim);font-size:13px;padding:28px 10px;text-align:center;border:1px dashed var(--border);border-radius:10px}
details.ev{margin-top:12px}
details.ev summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
.tw{overflow-x:auto;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
th,td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:right}
th{color:var(--muted);font-weight:600;font-size:11px}
th:nth-child(-n+3),td:nth-child(-n+3){text-align:left}
td .del{background:none;border:0;color:#ff8a94;cursor:pointer;padding:2px 6px;border-radius:6px}
td .del:hover{background:rgba(240,67,82,.12)}
.empty{text-align:center;padding:48px 16px}
.empty h2{margin:0 0 6px;font-size:18px}
.empty p{color:var(--muted);margin:0 0 16px}
.empty .bb{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
details.method{color:var(--muted);font-size:13px}
details.method summary{cursor:pointer;font-weight:650;color:var(--text);font-size:13.5px}
details.method li{margin:5px 0}
details.method b{color:var(--text)}

/* —— Modal —— */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:60;padding:16px}
.modal{background:#0e121c;border:1px solid var(--border);border-radius:16px;width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.mh h3{margin:0;font-size:18px}
.mh .x{background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
.mb{padding:16px 20px;overflow:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{grid-column:span 2}
.f.half{grid-column:span 1}
@media (max-width:520px){.f.half{grid-column:span 2}}
.f label{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:12.5px;margin-bottom:5px}
.f label .prev{font-weight:500;color:var(--dim)}
.f label .prev.bad{color:#ff8a94}
.f input,.f select,.f textarea{width:100%;background:#121722;border:1px solid var(--border);border-radius:10px;color:var(--text);padding:10px 11px;font:inherit;transition:border-color .12s}
.f textarea{min-height:60px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(79,124,255,.2)}
.f .hint{color:var(--dim);font-size:11.5px;margin-top:4px}
.note{color:var(--muted);font-size:12.5px;margin:12px 0 0}
.err{background:rgba(240,67,82,.1);color:#ff8a94;border-radius:8px;padding:8px 10px;margin-top:12px}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

/* Sparkline */
.spark{display:inline-block;vertical-align:middle;margin-left:6px}
.spark path{fill:none;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}

@media (max-width:760px){
  .metrics{width:100%;justify-content:flex-start;gap:12px}
  .m{text-align:left}
  .chev{position:absolute;right:12px}
  .pool-head{position:relative;padding-right:52px}
  h1{font-size:20px}
  .logo{width:34px;height:34px;font-size:13px}
}

/* v2 cross layout */
.breadcrumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.bc{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:12px;color:var(--muted);font-weight:600}
.bc.on{border-color:rgba(79,124,255,.4);background:rgba(79,124,255,.1);color:var(--text)}
.bc button{border:0;background:none;color:inherit;cursor:pointer;padding:0;font:inherit;font-weight:700}
.bc .x{opacity:.6;margin-left:2px}
.bc .x:hover{opacity:1;color:var(--red)}
.quick-nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.qn{border:1px solid var(--border);background:var(--card2);color:var(--muted);padding:6px 11px;border-radius:9px;font-size:12px;font-weight:650;cursor:pointer;transition:all .12s}
.qn:hover{border-color:var(--border2);color:var(--text);background:var(--elev)}
.cross3{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;align-items:start}
@media(max-width:1000px){.cross3{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.cross3{grid-template-columns:1fr}}

.cross3 > .cross-panel{min-height:0}
.cross-wide{grid-column:1 / -1}
.rank-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:800px){.rank-grid{grid-template-columns:1fr}}
.pair-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pair-chip{margin:0}
.matrix-split{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;margin-top:10px;align-items:start}
@media(max-width:900px){.matrix-split{grid-template-columns:1fr}}

.pair-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:10px;border:1px solid var(--border);background:var(--card);cursor:pointer;transition:all .12s;font-size:12.5px;margin:0 6px 6px 0}
.pair-chip:hover{border-color:rgba(79,124,255,.4);background:rgba(79,124,255,.06)}
.pair-chip b{font-weight:700}
.pair-chip span{color:var(--dim);font-size:11px}
.stat-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{padding:6px 10px;border-radius:9px;border:1px solid var(--border);background:var(--card);font-size:12px;cursor:pointer;transition:all .12s}
.pill:hover{border-color:var(--border2);transform:translateY(-1px)}
.pill b{display:block;font-size:15px;font-weight:750;margin-top:2px;font-variant-numeric:tabular-nums}
.pill .pl{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:650}
.pool-link{border:0;background:none;color:var(--blue2);font:inherit;font-weight:650;cursor:pointer;padding:0;text-align:left}
.pool-link:hover{text-decoration:underline;color:#a5c0ff}
.ex-row{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:8px;cursor:pointer;transition:background .12s}
.ex-row:hover,.ex-row.on{background:rgba(79,124,255,.08)}
.ex-row .ex-name{flex:1;font-weight:650;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-row .ex-bar{flex:1.2;height:6px;background:rgba(255,255,255,.04);border-radius:999px;overflow:hidden}
.ex-row .ex-fill{height:100%;background:linear-gradient(90deg,#38bdf8,#4f7cff);border-radius:999px}
.ex-row .ex-val{font-size:11.5px;font-weight:650;color:var(--muted);min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>

let CACHE = {};
let PSERIES = [];

const nextSeq = () => Date.now() * 100 + (SEQ++ % 100);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const ok = n => n != null && isFinite(n);
const money = n => ok(n) ? (n < -0.004 ? '-' : '') + '$' + nf2.format(Math.abs(n)) : '—';
const smoney = n => ok(n) ? (n < -0.004 ? '-' : '+') + '$' + nf2.format(Math.abs(n)) : '—';
const pct = x => ok(x) ? nf2.format(x * 100) + '%' : '—';
const spct = x => ok(x) ? (x >= -0.00005 ? '+' : '') + nf2.format(Math.abs(x) < 0.00005 ? 0 : x * 100) + '%' : '—';
const sgn = x => !ok(x) ? 'neu' : x > 0.00005 ? 'pos' : x < -0.00005 ? 'neg' : 'neu';
const fmtNum = n => ok(n) ? n.toLocaleString('pt-PT', { maximumFractionDigits: 8 }) : '';
const numToInput = n => ok(n) ? String(Math.round(n * 1e8) / 1e8).replace('.', ',') : '';

const splitDT = s => [s.slice(0, 10), s.slice(11, 16)];
function fmtDT(t) { const d = new Date(t); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtD(t) { const d = new Date(t); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`; }
function fmtAxisT(t, span) { const d = new Date(t); return span < 2 * DAY ? `${pad(d.getDate())}/${pad(d.getMonth() + 1)} ${pad(d.getHours())}:${pad(d.getMinutes())}` : `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${String(d.getFullYear()).slice(2)}`; }
function fAxisMoney(v) { const a = Math.abs(v), s = v < 0 ? '-' : ''; if (a >= 1e6) return s + '$' + fmt(a / 1e6, 2) + 'M'; if (a >= 1e3) return s + '$' + fmt(a / 1e3, a >= 1e5 ? 0 : 1) + 'k'; return s + '$' + fmt(a, a < 10 ? 2 : 0); }
const fAxisPct = v => fmt(v, Math.abs(v) < 10 ? 1 : 0) + '%';
const fTipPct = v => nf2.format(v) + '%';

function parseNum(str, money = false) {
  let s = String(str ?? '').trim().replace(/\s|\$|US/gi, '');
  if (!s) return null;
  const c = s.includes(','), d = s.includes('.');
  if (c && d) { s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, ''); }
  else if (c) { s = (s.match(/,/g).length > 1) ? s.replace(/,/g, '') : s.replace(',', '.'); }
  else if (d && s.match(/\./g).length > 1) { s = s.replace(/\./g, ''); }
  else if (d && money && /^-?[1-9]\d{0,2}\.\d{3}$/.test(s)) { s = s.replace('.', ''); }   // 1.500 = mil e quinhentos (pt-BR)
  const n = Number(s);
  return isFinite(n) ? n : NaN;
}

/* Mapa nome da rede → chave em NETWORK_IMG (match parcial, case-insensitive) */
const NETWORK_IMG_MATCH = [
  [/solana\s*etf|etf\s*solana/i, 'solana_etf'],
  [/solana\s*rwa|rwa\s*solana/i, 'solana_rwa'],
  [/solana|^sol$/i, 'solana'],
  [/ethereum|^eth$|^mainnet$/i, 'eth'],
  [/arbitrum|^arb$/i, 'arbitrum'],
  [/^base$/i, 'base'],
  [/polygon|^matic$/i, 'polygon'],
  [/binance|^bsc$|^bnb$/i, 'bnb'],
  [/hyperliquid|^hyper$|^hl$/i, 'hyper'],
  [/robin\s*hood|^hood$|^rh$/i, 'robin_hood']
];
/* Fallback emoji quando não há imagem */
const NETWORK_EMOJI = [
  [/optimism|^op$/i, '🔴'],
  [/avalanche|^avax$/i, '🔺'],
  [/sui$/i, '💧'],
  [/aptos|^apt$/i, '🅰️'],
  [/cosmos|^atom$/i, '⚛️'],
  [/near$/i, 'Ⓝ'],
  [/fantom|^ftm$/i, '👻'],
  [/tron|^trx$/i, 'Ｔ'],
  [/ton$/i, '💎'],
  [/bitcoin|^btc$/i, '₿'],
  [/blast$/i, '💥'],
  [/não informada|nao informada|n\/a|^—$|^-$/i, '❔']
];
function networkIconKey(name) {
  const s = String(name || '').trim();
  if (!s) return null;
  for (const [re, key] of NETWORK_IMG_MATCH) if (re.test(s)) return key;
  return null;
}
function networkIconHTML(name) {
  const key = networkIconKey(name);
  if (key && NETWORK_IMG[key]) return `<img class="net-img" src="${NETWORK_IMG[key]}" alt="" width="18" height="18" loading="lazy"/>`;
  const s = String(name || '').trim();
  if (!s) return '<span class="net-ico">❔</span>';
  for (const [re, icon] of NETWORK_EMOJI) if (re.test(s)) return `<span class="net-ico">${icon}</span>`;
  return '<span class="net-ico">🔗</span>';
}
function networkLabel(name) {
  const n = String(name || '').trim() || 'Não informada';
  return `<span class="net">${networkIconHTML(n)}<span class="net-name">${esc(n)}</span></span>`;
}

/* ---------- persistência ---------- */
function emptyDB() { return { app: 'pool-monitor', version: 1, savedAt: null, pools: [] }; }
const validDB = d => d && typeof d === 'object' && Array.isArray(d.pools);
function loadLocal() { try { const s = localStorage.getItem(LS_KEY); if (s) { const d = JSON.parse(s); if (validDB(d)) return d; } } catch (e) { } return emptyDB(); }
function storeLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); } catch (e) { } }
function save() {
  if (UI.demo) { render(); return; }   // dados de exemplo nunca são gravados
  stampChanges();
  DB.savedAt = new Date().toISOString();
  storeLocal();
  scheduleFileWrite();
  render();
}

function idbOpen() { return new Promise((res, rej) => { const r = indexedDB.open('poolMonitor', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbDo(mode, fn) { const db = await idbOpen(); return new Promise((res, rej) => { const st = db.transaction('kv', mode).objectStore('kv'); const rq = fn(st); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }); }
const idbGet = k => idbDo('readonly', s => s.get(k));
const idbSet = (k, v) => idbDo('readwrite', s => s.put(v, k));
const idbDel = k => idbDo('readwrite', s => s.delete(k));

/* ---------- sincronização com o arquivo: mescla por id (nunca sobrescreve às cegas) ---------- */
/* SYNC-PURE-BEGIN */
let TOMB = {}, BASE = new Map(), FORCE_NEXT = false;   // TOMB: ids excluídos (id → quando); BASE: último estado conhecido
const cl = o => JSON.parse(JSON.stringify(o));

function sparkline(vals, color) {
  const v = vals.filter(ok);
  if (v.length < 2) return '';
  const w = 56, h = 18, min = Math.min(...v), max = Math.max(...v), span = max - min || 1;
  let d = '';
  v.forEach((x, i) => {
    const px = (i / (v.length - 1)) * w;
    const py = h - 1 - ((x - min) / span) * (h - 2);
    d += (i ? 'L' : 'M') + px.toFixed(1) + ',' + py.toFixed(1);
  });
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path d="${d}" stroke="${color}"/></svg>`;
}

  if (stale.length) alerts.push({ icon: '!', type: 'bad', html: `<b>${stale.length} desatualizada(s):</b> ${stale.slice(0,3).map(x => `${esc(poolName(x.p))} (${Math.floor(freshnessDays(x))}d)`).join(', ')}${stale.length > 3 ? '…' : ''}` });
  if (shortCount) alerts.push({ icon: '≈', type: 'warn', html: `<b>${shortCount} amostra(s) curta(s).</b> APR pode oscilar muito.` });
  if (losing.length) alerts.push({ icon: '↓', type: 'bad', html: `<b>${losing.length} com resultado negativo:</b> ${losing.slice(0,3).map(x => `${esc(poolName(x.p))} (${smoney(x.r.cur.ganho)})`).join(', ')}` });
  const valueActive = active.reduce((z,x) => z + Math.max(0, x.r.cur.valor), 0);
  const networks = new Map();
  active.forEach(x => { const k = (String(x.p.rede || '').trim() || 'Não informada'); networks.set(k, (networks.get(k)||0) + Math.max(0,x.r.cur.valor)); });
  const topNetwork = [...networks.entries()].sort((a,b)=>b[1]-a[1])[0];
  if (topNetwork && valueActive > 0 && topNetwork[1] / valueActive >= .6 && active.length > 1) alerts.push({ icon: '◎', type: 'warn', html: `<b>Concentração:</b> ${esc(topNetwork[0])} = ${pct(topNetwork[1]/valueActive)} do valor ativo.` });
  if (active.some(x => ok(x.p.rangeMin) || ok(x.p.rangeMax))) alerts.push({ icon: '↔', type: 'warn', html: `<b>Ranges offline.</b> Confirme no protocolo se ainda está in-range.` });
  if (!alerts.length) alerts.push({ icon: 'i', type: '', html: `<b>Sem alertas básicos.</b> O monitor não verifica contratos, depeg ou preços externos.` });
  const feesTotActive = active.reduce((z,x) => z + x.r.cur.feesTot, 0);

  return `<section class="dash-section">
    <div class="dash-title"><div><h2>Destaques</h2><p>Clique no cartão para abrir a pool</p></div></div>
    <div class="dash-grid">
      ${metric('Melhor APR (dados OK)', bestAPR ? pct(bestAPR.r.cur.apr) : '—', 'apr', descPool(bestAPR), bestAPR ? currentStatus(bestAPR) : {label:'≥7 d · ≥2 atualizações',cls:'warn'}, bestAPR?.p.id)}
      ${metric('Maior resultado', bestGain ? smoney(bestGain.r.cur.ganho) : '—', sgn(bestGain?.r.cur.ganho), descPool(bestGain), bestGain ? currentStatus(bestGain) : null, bestGain?.p.id)}
      ${metric('Mais fees', mostFees ? money(mostFees.r.cur.feesTot) : '—', 'fee', mostFees ? descPool(mostFees) : '—', mostFees ? currentStatus(mostFees) : null, mostFees?.p.id)}
      ${worstGain && bestGain && worstGain.p.id !== bestGain.p.id ? metric('Menor resultado', smoney(worstGain.r.cur.ganho), sgn(worstGain.r.cur.ganho), descPool(worstGain), currentStatus(worstGain), worstGain.p.id) : metric('Ativas', String(active.length), 'neu', 'no filtro atual')}
      ${metric('Fees / valor', valueActive > 0 ? pct(feesTotActive / valueActive) : '—', 'fee', 'sobre capital em posição')}
      ${metric('Valor ativo', money(valueActive), 'inv', active.length + ' pool(s) aberta(s)')}
    </div>
    <div style="margin-top:10px"><div class="dash-title"><div><h2>Alertas</h2></div><span class="state-tag ${alerts.some(a=>a.type==='bad')?'bad':alerts.some(a=>a.type==='warn')?'warn':'good'}">${alerts.length}</span></div>
      <div class="alert-list">${alerts.map(a => `<div class="alert-item"><span class="alert-icon">${a.icon}</span><div>${a.html}</div></div>`).join('')}</div>
    </div>
  </section>`;
}
function practicesHTML() {

    <div class="practices-grid">

function methodHTML() {
  return `<details class="section method"><summary>Como os indicadores são calculados</summary><ul>
    <li><b>Valor Atual</b>: último valor da posição informado em “Atualizar” (sem as fees pendentes). Reforços e retiradas ajustam esse valor de imediato.</li>
    <li><b>Capital investido</b> = liquidez inicial + reforços − retiradas.</li>
    <li><b>Variação da posição</b> = Valor atual − Capital investido. Mostra a diferença em USD face ao capital líquido aportado, mas <b>não mede a impermanent loss isoladamente</b>: para isso seria necessário comparar com o valor de manter os mesmos tokens fora da pool.</li>
    <li><b>Fees Acumuladas</b> = fees ainda não recolhidas, informadas a cada atualização. <b>Recolher Fees</b> passa esse valor para “recolhidas”.</li>
    <li><b>Mover range (rebalance)</b>: regista o novo intervalo de preço, o valor da posição depois da operação e as fees recolhidas no processo. O capital investido não muda; as fees pendentes passam a zero e o valor/fees entram no histórico como nos outros lançamentos. Gas e slippage não são descontados automaticamente.</li>
    <li><b>Resultado registado</b> = Variação + fees recolhidas + fees pendentes. <b>ROI total</b> = resultado registado ÷ capital médio. Não desconta gas, slippage, bridge, impostos ou custo de oportunidade.</li>
    <li><b>Capital médio</b> = capital investido ponderado pelo tempo em que ficou aplicado. Sem reforços ou retiradas, é igual à liquidez inicial.</li>
    <li><b>APR (fees)</b> = fees totais reportadas ÷ capital médio × 365 ÷ dias, sem capitalização. O cálculo usa o período registado até ao último lançamento e não é uma previsão; só é exibido com pelo menos 1 dia de histórico, pois janelas curtas produzem percentagens muito elevadas. A data do último lançamento nem sempre substitui a necessidade de atualizar regularmente o valor e as fees.</li>
    <li><b>ROI anualizado</b> = ROI × 365 ÷ dias (anualização simples, sem capitalização).</li>
    <li><b>APR Médio</b> da carteira = média dos APRs ponderada pelo capital médio de cada pool. Pools que ainda não têm nenhuma atualização ficam fora dessa média. Os cartões e o gráfico da carteira seguem o filtro selecionado (Todas, Ativas ou Fechadas) e o filtro por rede (clique no nome da rede no resumo).</li>
    <li>Cada lançamento fica gravado com data e hora. Para corrigir um lançamento, elimine-o na tabela “Lançamentos” e registe-o de novo. Pode lançar datas passadas, e o histórico é reordenado automaticamente.</li>
  </ul></details>`;
}
function render() {
  const app = $('#app');
  const all = DB.pools.map(p => ({ p, r: compute(p) }));
  CACHE = {}; all.forEach(x => CACHE[x.p.id] = x);
  const nAt = all.filter(x => x.r.cur && !x.r.st.closed).length, nFe = all.filter(x => x.r.st.closed).length;
  const statusList = all.filter(x => x.r.cur && (UI.filter === 'todas' || (UI.filter === 'ativas' ? !x.r.st.closed : x.r.st.closed)));
  let list = statusList.filter(x => {
    if (UI.rede && String(x.p.rede || '').trim().toLocaleLowerCase() !== UI.rede.toLocaleLowerCase()) return false;
    if (UI.exchange && String(x.p.exchange || '').trim().toLocaleLowerCase() !== UI.exchange.toLocaleLowerCase()) return false;
    return true;
  });
  const sortFn = {
    recent: (a, b) => (a.r.st.closed - b.r.st.closed) || (b.r.st.start - a.r.st.start),
    valor: (a, b) => (b.r.cur?.valor || 0) - (a.r.cur?.valor || 0),
    roi: (a, b) => (b.r.cur?.ganho || 0) - (a.r.cur?.ganho || 0),
    apr: (a, b) => { const x = a.r.cur?.apr, y = b.r.cur?.apr; if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1; return y - x; },
    fees: (a, b) => (b.r.cur?.feesTot || 0) - (a.r.cur?.feesTot || 0)
  };
  list = list.sort(sortFn[UI.sort] || sortFn.recent);
  PSERIES = portfolioSeries(list);
  app.innerHTML = headerHTML() + `<div id="banner">${bannerHTML()}</div>` +
    (DB.pools.length ? cardsHTML(aggregate(list.map(x => x.r.cur))) + networkSummaryHTML(statusList) + insightsHTML(list) + portfolioHTML() + poolsHTML(list, all.length, nAt, nFe) : emptyHTML()) +
    methodHTML() + (DB.pools.length ? practicesHTML() : '');
  drawCharts();
}

    inp.addEventListener('input', upd); upd();
  });
  form.addEventListener('submit', e => {
    e.preventDefault();
    const vals = {};
    for (const f of cfg.fields) {
      const raw = form.elements[f.name].value;
      if (f.type === 'num') {
        const n = parseNum(raw, f.money !== false);
        if (Number.isNaN(n)) return showErr(`Valor inválido em “${f.label}”.`);
        if (n === null && f.req) return showErr(`Preencha “${f.label}”.`);
        vals[f.name] = n;
      } else {
        const s = raw.trim();
        if (!s && f.req) return showErr(`Preencha “${f.label}”.`);
        if (f.maxlen && s.length > f.maxlen) return showErr(`“${f.label}”: no máximo ${f.maxlen} caracteres.`);
        vals[f.name] = s;

}
const hashField = () => ({ name: 'hash', label: 'Referência do hash (4 caracteres)', ph: 'ex.: a3f9', maxlen: 4, hint: 'Opcional. 4 caracteres do hash da transação (por exemplo, os últimos 4), apenas para sua referência.' });
const dtFields = () => { const [d, t] = splitDT(nowInput()); return [{ name: 'data', label: 'Data', type: 'date', half: 1, value: d, req: 1 }, { name: 'hora', label: 'Hora', type: 'time', half: 1, value: t, req: 1 }]; };
function checkDate(P, tt) {
  const t = parseT(tt), st = CACHE[P.id].r.st;

  if (t < st.start) return `A data não pode ser anterior à abertura da pool (${fmtDT(st.start)}).`;
  if (t > Date.now() + 5 * 60000) return 'A data não pode estar no futuro.';
}
function poolForm(P) {
  const ab = P ? P.events.find(e => e.type === 'abertura') : null;
  const [d, t] = splitDT(ab ? ab.t : nowInput());
  const ov = openForm({

      { name: 'rede', label: 'Rede', ph: 'Arbitrum', half: 1, value: P?.rede },

      { name: 'token1', label: 'Token 1', ph: 'ETH', half: 1, value: P?.token1, req: 1 },
      { name: 'token2', label: 'Token 2', ph: 'USDC', half: 1, value: P?.token2, req: 1 },

      { name: 'hora', label: 'Hora', type: 'time', half: 1, value: t, req: 1 },

        Object.assign(P, data); ab.valor = v.valor; ab.t = tt;
      } else {

        DB.pools.push(Object.assign({ id }, data, { events: [{ id: uid(), type: 'abertura', t: tt, valor: v.valor, fees: null, seq: nextSeq() }] }));

  const f = ov.querySelector('form').elements;

function updateForm(P) {

    onSubmit: v => {

      P.rangeMax = v.rangeMax;

let REAL = null;

/* ---------- eventos ---------- */
document.addEventListener('click', ev => {
  const menu = $('#menu');
  const b = ev.target.closest('[data-act]');
  if (menu && !menu.hidden && !ev.target.closest('.menu-wrap')) menu.hidden = true;
  if (!b) return;
  const act = b.dataset.act, id = b.dataset.id, P = id ? DB.pools.find(p => p.id === id) : null;
  if (menu && b.closest('.menu')) menu.hidden = true;
  if (UI.demo && ['update', 'collect', 'flow', 'close', 'reopen', 'edit', 'delpool', 'delev', 'export', 'csv-ev', 'csv-pools', 'wipe', 'link', 'rebalance'].includes(act)) {
    alert('Isto é apenas um exemplo. Saia do modo exemplo para lançar e guardar os seus próprios dados.'); return;
  }
  switch (act) {
    case 'menu': menu.hidden = !menu.hidden; break;
    case 'new': poolForm(); break;
    case 'toggle': {
      UI.open[id] = !UI.open[id];
      render();
      if (UI.open[id]) setTimeout(() => { const el = document.getElementById('pool-' + id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 40);
      break;
    }
    case 'tab': UI.tab[id] = b.dataset.k; drawCharts(); b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); break;
    case 'ptab': UI.ptab = b.dataset.k; drawCharts(); b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); break;
    case 'filter': UI.filter = UI.filter === b.dataset.k ? 'todas' : b.dataset.k; render(); break;
    case 'filter-rede': {
      const k = (b.dataset.k || '').trim();
      UI.rede = (!k || (UI.rede && UI.rede.toLocaleLowerCase() === k.toLocaleLowerCase())) ? null : k;
      render();
      break;
    }
    case 'filter-ex': {
      const k = (b.dataset.k || '').trim();
      UI.exchange = (!k || (UI.exchange && UI.exchange.toLocaleLowerCase() === k.toLocaleLowerCase())) ? null : k;
      render();
      break;
    }
    case 'sort': UI.sort = b.dataset.k || 'recent'; render(); break;
    case 'scroll': {
      const map = { pools: 'sec-pools', cross: 'sec-cross', matrix: 'sec-matrix', ranks: 'sec-ranks', port: 'sec-port', pairs: 'sec-pairs' };
      const el = document.getElementById(map[b.dataset.k] || b.dataset.k);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      break;
    }
    case 'update': updateForm(P); break;
    case 'rebalance': rebalanceForm(P); break;
    case 'collect': collectForm(P); break;
    case 'flow': flowForm(P); break;
    case 'close': closeForm(P); break;
    case 'edit': poolForm(P); break;
    case 'reopen':
      if (confirm(`Reabrir “${poolName(P)}”? O lançamento de fecho será removido.`)) { P.events = P.events.filter(e => e.type !== 'fechamento'); save(); }
      break;
    case 'delpool':
      if (confirm(`Eliminar a pool “${poolName(P)}” e todo o seu histórico (${P.events.length} lançamentos)?\n\nIsto não pode ser desfeito, a não ser que tenha um backup.`)) { DB.pools = DB.pools.filter(p => p !== P); save(); }
      break;
    case 'delev': {
      const e = P.events.find(x => x.id === b.dataset.ev);
      if (e && confirm(`Eliminar o lançamento “${TYPE_LABEL[e.type]}” de ${fmtDT(parseT(e.t))}?`)) {
        P.events = P.events.filter(x => x !== e);
        if (e.type === 'rebalance') {
          const rebs = sortedEvents(P).filter(x => x.type === 'rebalance');
          if (rebs.length) { P.rangeMin = rebs[rebs.length - 1].rangeMin; P.rangeMax = rebs[rebs.length - 1].rangeMax; }
          else if ('prevMin' in e) { P.rangeMin = e.prevMin; P.rangeMax = e.prevMax; }
        }
        UI.open[P.id + ':ev'] = true;
        save();
      }
      break;
    }

    case 'open-file': if (UI.demo) exitDemo(); openExistingFile(); break;
    case 'unlink': unlinkFile(); break;
    case 'reconnect': reconnectFile(); break;
    case 'export': exportBackup(); break;
    case 'import': if (UI.demo) exitDemo(); importBackup(); break;
    case 'csv-ev': exportEventsCSV(); break;

      break;
  }
});
document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details[data-evid]')) UI.open[d.dataset.evid + ':ev'] = d.open; }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const m = $('#menu'); if (m) m.hidden = true; } });
let rT = null;
window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(drawCharts, 150); });
window.addEventListener('storage', e => { if (e.key === LS_KEY && !UI.demo) { adoptDB(loadLocal()); render(); } });
window.addEventListener('focus', pullFromFile);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pullFromFile(); });

async function init() {
  adoptDB(loadLocal());
  if (location.hash === '#exemplo' && !DB.pools.length) enterDemo(); else render();
  if (!FILE.supported) return;
  try {
    const h = await idbGet('handle');
    if (!h) return;
    FILE.handle = h; FILE.name = h.name;
    if ((await h.queryPermission({ mode: 'readwrite' })) === 'granted') { if (!UI.demo) await syncFromFile(); else FILE.state = 'ok'; }
    else FILE.state = 'needs-permission';
  } catch (e) { console.error(e); FILE.state = FILE.handle ? 'error' : 'none'; }
  if (!UI.demo) render(); else updateStatus();
}
init();
